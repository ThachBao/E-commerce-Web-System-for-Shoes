<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Thủ tục thanh toán - ShoeStore</title>
</head>
<body>
    <section class="container mt-4 mb-5">
        <div class="mb-4">
            <a href="/cart-ui" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Quay lại giỏ hàng</a>
            <h2 class="fw-bold mt-3">Thủ tục thanh toán</h2>
        </div>
        
        <div class="row g-5">
            <div class="col-lg-7">
                <div class="cart-container shadow-sm border-0 bg-white rounded-4 p-4 p-md-5">
                    <h4 class="fw-bold mb-4 pb-3" style="border-bottom: 2px solid #f8fafc;"><i class="bi bi-truck text-warning me-2"></i> Thông tin giao hàng</h4>
                    <form id="form-checkout">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="shippingFullName" placeholder="Họ và tên người nhận" th:value="${currentUser != null ? currentUser.fullName : ''}" required>
                                    <label for="shippingFullName" class="text-muted">Họ và tên người nhận</label>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control" id="shippingPhone" placeholder="Số điện thoại" th:value="${currentUser != null && currentUser.phone != null ? currentUser.phone : ''}" pattern="0[35789][0-9]{8}" title="Vui lòng nhập đúng định dạng số điện thoại Việt Nam (10 số, bắt đầu bằng 03, 05, 07, 08, hoặc 09)" required>
                                    <label for="shippingPhone" class="text-muted">Số điện thoại</label>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-floating">
                                    <select class="form-select" id="province" required>
                                        <option value="" disabled selected>Chọn Tỉnh/Thành phố</option>
                                    </select>
                                    <label for="province" class="text-muted">Tỉnh/Thành phố</label>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-floating">
                                    <select class="form-select" id="district" required disabled>
                                        <option value="" disabled selected>Chọn Quận/Huyện</option>
                                    </select>
                                    <label for="district" class="text-muted">Quận/Huyện</label>
                                </div>
                            </div>
                            <div class="col-sm-4">
                                <div class="form-floating">
                                    <select class="form-select" id="ward" required disabled>
                                        <option value="" disabled selected>Chọn Phường/Xã</option>
                                    </select>
                                    <label for="ward" class="text-muted">Phường/Xã</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="addressDetail" placeholder="Số nhà, Tên đường..." required>
                                    <label for="addressDetail" class="text-muted">Số nhà, Tên đường (Địa chỉ chi tiết)</label>
                                </div>
                                <input type="hidden" id="shippingAddress" value="">
                            </div>
                        </div>
                        <div class="mb-4 form-floating">
                            <textarea class="form-control" id="note" style="height: 100px" placeholder="Ghi chú"></textarea>
                            <label for="note" class="text-muted">Ghi chú (Tùy chọn)</label>
                        </div>
                        
                        <h4 class="fw-bold mb-4 mt-5 pb-3" style="border-bottom: 2px solid #f8fafc;"><i class="bi bi-wallet2 text-warning me-2"></i> Phương thức thanh toán</h4>
                        <div class="mb-5">
                            <div class="form-check payment-card p-3 mb-3 shadow-sm d-flex align-items-center">
                                <input class="form-check-input ms-1 mt-0" type="radio" name="paymentMethodRadio" id="paymentCOD" value="COD" checked style="cursor: pointer; accent-color: var(--color-accent);">
                                <label class="form-check-label fw-semibold ms-3 d-flex align-items-center gap-3 w-100" style="cursor:pointer;" for="paymentCOD">
                                    <i class="bi bi-cash-coin fs-3 text-success"></i>
                                    <div>
                                        <div class="d-block text-dark fw-bold">Thanh toán khi nhận hàng (COD)</div>
                                        <small class="text-muted fw-normal">Thanh toán bằng tiền mặt khi giao hàng tận nơi</small>
                                    </div>
                                </label>
                            </div>
                            <div class="form-check payment-card p-3 shadow-sm d-flex align-items-center">
                                <input class="form-check-input ms-1 mt-0" type="radio" name="paymentMethodRadio" id="paymentBank" value="BANK_TRANSFER" style="cursor: pointer; accent-color: var(--color-accent);">
                                <label class="form-check-label fw-semibold ms-3 d-flex align-items-center gap-3 w-100" style="cursor:pointer;" for="paymentBank">
                                    <i class="bi bi-bank fs-3 text-warning"></i>
                                    <div>
                                        <div class="d-block text-dark fw-bold">Chuyển khoản ngân hàng</div>
                                        <small class="text-muted fw-normal">Quét mã QR để hoàn tất thanh toán nhanh chóng</small>
                                    </div>
                                </label>
                            </div>
                            <input type="hidden" id="paymentMethod" value="COD">
                        </div>
                        
                        <button type="submit" class="btn btn-warning btn-lg btn-hover-lift w-100 fw-bold mt-3 py-3 shadow-sm" id="btn-checkout" style="font-size: 1.1rem; letter-spacing: 0.5px;">
                            XÁC NHẬN ĐẶT HÀNG <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="cart-container shadow-sm border-0 bg-white rounded-4 p-4 position-sticky" style="top: 100px;">
                    <h4 class="fw-bold mb-4"><i class="bi bi-receipt text-warning me-2"></i> Tóm tắt đơn hàng</h4>
                    <div id="checkout-cart-items" class="mb-4 pe-2" style="max-height: 450px; overflow-y: auto; overflow-x: hidden;">
                        <div class="text-center py-5"><div class="spinner-border text-warning" role="status"></div><div class="mt-2 text-muted">Đang tải đơn hàng...</div></div>
                    </div>
                    <div class="p-3 rounded-4 mt-4" style="background-color: #f8fafc; border: 1px solid rgba(15, 23, 42, 0.04);">
                        <div class="d-flex justify-content-between mb-2 text-muted" style="font-size: 0.92rem;">
                            <span>Tạm tính</span>
                            <span id="cart-subtotal-display" class="fw-semibold text-dark">...</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted" style="font-size: 0.92rem;">
                            <span>Phí vận chuyển</span>
                            <span class="text-success fw-semibold">Miễn phí</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top" style="border-color: #e2e8f0 !important;">
                            <span class="fs-5 fw-bold text-dark">Tổng cộng</span>
                            <span class="fs-3 fw-bold text-warning" id="cart-subtotal">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
            /* Custom Scrollbar for cart items */
            #checkout-cart-items::-webkit-scrollbar { width: 6px; }
            #checkout-cart-items::-webkit-scrollbar-track { background: #f8fafc; border-radius: 10px; }
            #checkout-cart-items::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
            #checkout-cart-items::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
            
            /* Modern Payment Card Styles */
            .payment-card {
                background: #f8fafc;
                border: 1px solid #e2e8f0 !important;
                border-radius: 16px !important;
                transition: all var(--transition-fast) !important;
                cursor: pointer;
            }
            .payment-card:hover {
                border-color: var(--color-accent) !important;
                background: #ffffff !important;
                box-shadow: var(--shadow-sm) !important;
            }
            .form-check-input:checked + label .text-dark {
                color: var(--color-accent) !important;
            }
            
            /* Custom Checkout Item Hover */
            .checkout-item-card {
                transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
            }
            .checkout-item-card:hover {
                transform: translateY(-2px);
                border-color: rgba(217, 119, 6, 0.25) !important;
                box-shadow: var(--shadow-md) !important;
            }
        </style>

        <script>
            // Sync radio to hidden input
            document.querySelectorAll('input[name="paymentMethodRadio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    document.getElementById('paymentMethod').value = this.value;
                });
            });

            // Independent load function for Checkout page to avoid conflict with cart.js
            async function loadCheckoutCart() {
                try {
                    const response = await fetch('/carts');
                    const data = await response.json();
                    
                    if (!data.success) {
                        showToast(data.message || 'Lỗi tải giỏ hàng', 'danger');
                        return;
                    }
                    
                    const cart = data.data;
                    const container = document.getElementById('checkout-cart-items');
                    if (!container) return;
                    
                    container.innerHTML = '';
                    
                    let selectedIdsStr = sessionStorage.getItem('selectedCartItemIds');
                    let selectedIds = selectedIdsStr ? JSON.parse(selectedIdsStr) : [];
                    
                    let itemsToRender = [];
                    if (cart.items && cart.items.length > 0) {
                        if (selectedIds.length > 0) {
                            itemsToRender = cart.items.filter(item => selectedIds.includes(item.id));
                        } else {
                            itemsToRender = cart.items;
                        }
                    }
                    
                    if (itemsToRender.length === 0) {
                        container.innerHTML = '<div class="alert alert-warning text-center border-0 shadow-sm rounded-4 py-4"><i class="bi bi-exclamation-circle fs-3 d-block mb-2 text-warning"></i>Giỏ hàng trống hoặc chưa chọn sản phẩm.<br><a href="/cart-ui" class="btn btn-sm btn-dark mt-3 rounded-pill">Quay lại giỏ hàng</a></div>';
                        document.getElementById('cart-subtotal').innerText = '0 đ';
                        document.getElementById('cart-subtotal-display').innerText = '0 đ';
                        document.getElementById('btn-checkout').disabled = true;
                        return;
                    }
                    
                    let newSubTotal = 0;
                    
                    itemsToRender.forEach(item => {
                        newSubTotal += item.itemTotal;
                        const div = document.createElement('div');
                        div.className = 'd-flex align-items-center mb-3 bg-white p-3 rounded-4 border border-light-subtle shadow-sm position-relative checkout-item-card';
                        
                        const imgSrc = item.imageUrl || 'https://via.placeholder.com/70?text=No+Image';
                        const productName = item.productName || 'Sản phẩm ' + item.sku;
                        const variantInfo = (item.colorName && item.sizeName) ? `${item.colorName} / Size ${item.sizeName}` : `Mã: ${item.sku}`;
                        const localFormatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

                        div.innerHTML = `
                            <div class="flex-shrink-0 position-relative me-3">
                                <img src="${imgSrc}" class="rounded-4 border border-light bg-white" style="width: 70px; height: 70px; object-fit: contain; padding: 4px;">
                            </div>
                            <div class="flex-grow-1 min-w-0 pe-2">
                                <h6 class="mb-1 text-truncate fw-bold text-dark" style="font-size: 0.95rem; line-height: 1.4; letter-spacing: -0.2px;">${productName}</h6>
                                <small class="text-muted d-block text-truncate mb-2" style="font-size: 0.8rem;"><i class="bi bi-tag me-1 text-warning"></i>${variantInfo}</small>
                                <div class="d-flex justify-content-between align-items-center mt-1">
                                    <div class="fw-bold text-dark fs-6" style="color: #0f172a !important;">${localFormatVND(item.itemTotal)}</div>
                                    <div class="text-muted small fw-bold bg-light px-3 py-1 rounded-pill border" style="font-size: 0.75rem;">SL: ${item.quantity}</div>
                                </div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    
                    const localFormatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
                    const formattedSubTotal = localFormatVND(newSubTotal);
                    document.getElementById('cart-subtotal').innerText = formattedSubTotal;
                    document.getElementById('cart-subtotal-display').innerText = formattedSubTotal;
                } catch (error) {
                    console.error('Error loading checkout cart:', error);
                    showToast('Lỗi kết nối khi tải giỏ hàng', 'danger');
                }
            }

            // Address Handling
            let addressData = [];
            
            async function loadProvinces() {
                try {
                    const res = await fetch('https://provinces.open-api.vn/api/?depth=3');
                    addressData = await res.json();
                    
                    const provinceSelect = document.getElementById('province');
                    addressData.forEach(p => {
                        const option = document.createElement('option');
                        option.value = p.code;
                        option.text = p.name;
                        provinceSelect.appendChild(option);
                    });
                } catch (e) {
                    console.error('Error loading provinces', e);
                }
            }
            
            document.getElementById('province').addEventListener('change', function() {
                const districtSelect = document.getElementById('district');
                const wardSelect = document.getElementById('ward');
                
                districtSelect.innerHTML = '<option value="" disabled selected>Chọn Quận/Huyện</option>';
                wardSelect.innerHTML = '<option value="" disabled selected>Chọn Phường/Xã</option>';
                districtSelect.disabled = false;
                wardSelect.disabled = true;
                
                const selectedProvince = addressData.find(p => p.code == this.value);
                if (selectedProvince && selectedProvince.districts) {
                    selectedProvince.districts.forEach(d => {
                        const option = document.createElement('option');
                        option.value = d.code;
                        option.text = d.name;
                        districtSelect.appendChild(option);
                    });
                }
                updateFullAddress();
            });
            
            document.getElementById('district').addEventListener('change', function() {
                const wardSelect = document.getElementById('ward');
                wardSelect.innerHTML = '<option value="" disabled selected>Chọn Phường/Xã</option>';
                wardSelect.disabled = false;
                
                const selectedProvince = addressData.find(p => p.code == document.getElementById('province').value);
                if (selectedProvince) {
                    const selectedDistrict = selectedProvince.districts.find(d => d.code == this.value);
                    if (selectedDistrict && selectedDistrict.wards) {
                        selectedDistrict.wards.forEach(w => {
                            const option = document.createElement('option');
                            option.value = w.code;
                            option.text = w.name;
                            wardSelect.appendChild(option);
                        });
                    }
                }
                updateFullAddress();
            });
            
            document.getElementById('ward').addEventListener('change', updateFullAddress);
            document.getElementById('addressDetail').addEventListener('input', updateFullAddress);
            
            function updateFullAddress() {
                const p = document.getElementById('province');
                const d = document.getElementById('district');
                const w = document.getElementById('ward');
                const detail = document.getElementById('addressDetail').value;
                
                let addressParts = [];
                if (detail) addressParts.push(detail.trim());
                if (w.selectedIndex > 0) addressParts.push(w.options[w.selectedIndex].text);
                if (d.selectedIndex > 0) addressParts.push(d.options[d.selectedIndex].text);
                if (p.selectedIndex > 0) addressParts.push(p.options[p.selectedIndex].text);
                
                document.getElementById('shippingAddress').value = addressParts.join(', ');
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadCheckoutCart();
                loadProvinces();
            });
        </script>
    </section>
</body>
</html>
