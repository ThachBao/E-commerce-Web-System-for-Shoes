<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Thủ tục thanh toán - ShoeStore</title>
</head>
<body>
    <section class="container mt-4 mb-5">
        <div class="mb-4">
            <a href="/cart-ui" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Quay lại giỏ hàng</a>
            <h2 class="fw-bold mt-3">Thủ tục thanh toán</h2>
        </div>
        
        <div class="row g-5">
            <div class="col-lg-7">
                <div class="cart-container shadow-sm border-0 bg-white rounded-4 p-4 p-md-5">
                    <h4 class="fw-bold mb-4 pb-3" style="border-bottom: 2px solid #f1f1f1;"><i class="bi bi-truck text-primary me-2"></i> Thông tin giao hàng</h4>
                    <form id="form-checkout">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control bg-light" id="shippingFullName" placeholder="Họ và tên người nhận" value="Customer Test 01" required>
                                    <label for="shippingFullName">Họ và tên người nhận</label>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control bg-light" id="shippingPhone" placeholder="Số điện thoại" value="0987654321" required>
                                    <label for="shippingPhone">Số điện thoại</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="text" class="form-control bg-light" id="shippingAddress" placeholder="Địa chỉ chi tiết" value="123 Nguyễn Văn Cừ, Quận 5, TP.HCM" required>
                                    <label for="shippingAddress">Địa chỉ nhận hàng (Chi tiết)</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4 form-floating">
                            <textarea class="form-control border-light-subtle shadow-none bg-light" id="note" style="height: 100px" placeholder="Ghi chú"></textarea>
                            <label for="note" class="text-muted">Ghi chú (Tùy chọn)</label>
                        </div>
                        
                        <h4 class="fw-bold mb-4 mt-5 pb-3" style="border-bottom: 2px solid #f1f1f1;"><i class="bi bi-wallet2 text-primary me-2"></i> Phương thức thanh toán</h4>
                        <div class="mb-5">
                            <div class="form-check border border-light-subtle rounded-3 p-3 mb-3 shadow-sm" style="background: #f8f9fa; transition: 0.2s;" onmouseover="this.style.borderColor='#0d6efd'; this.style.backgroundColor='#fff'" onmouseout="this.style.borderColor='var(--bs-border-color)'; this.style.backgroundColor='#f8f9fa'">
                                <input class="form-check-input ms-1 mt-2" type="radio" name="paymentMethodRadio" id="paymentCOD" value="COD" checked>
                                <label class="form-check-label fw-semibold ms-2 d-flex align-items-center gap-3 w-100" style="cursor:pointer;" for="paymentCOD">
                                    <i class="bi bi-cash-coin fs-3 text-success"></i>
                                    <div>
                                        <div class="d-block text-dark">Thanh toán khi nhận hàng (COD)</div>
                                        <small class="text-muted fw-normal">Thanh toán bằng tiền mặt khi giao hàng</small>
                                    </div>
                                </label>
                            </div>
                            <div class="form-check border border-light-subtle rounded-3 p-3 shadow-sm" style="background: #f8f9fa; transition: 0.2s;" onmouseover="this.style.borderColor='#0d6efd'; this.style.backgroundColor='#fff'" onmouseout="this.style.borderColor='var(--bs-border-color)'; this.style.backgroundColor='#f8f9fa'">
                                <input class="form-check-input ms-1 mt-2" type="radio" name="paymentMethodRadio" id="paymentBank" value="BANK_TRANSFER">
                                <label class="form-check-label fw-semibold ms-2 d-flex align-items-center gap-3 w-100" style="cursor:pointer;" for="paymentBank">
                                    <i class="bi bi-bank fs-3 text-primary"></i>
                                    <div>
                                        <div class="d-block text-dark">Chuyển khoản ngân hàng</div>
                                        <small class="text-muted fw-normal">Quét mã QR để thanh toán nhanh chóng</small>
                                    </div>
                                </label>
                            </div>
                            <input type="hidden" id="paymentMethod" value="COD">
                        </div>
                        
                        <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold mt-3 py-3 shadow" id="btn-checkout" style="transition: all 0.3s; border-radius: 12px; font-size: 1.1rem; letter-spacing: 0.5px;">
                            XÁC NHẬN ĐẶT HÀNG <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="cart-container shadow border-0 bg-white rounded-4 p-4 position-sticky" style="top: 20px;">
                    <h4 class="fw-bold mb-4"><i class="bi bi-receipt text-primary me-2"></i> Tóm tắt đơn hàng</h4>
                    <div id="checkout-cart-items" class="mb-4 pe-2" style="max-height: 450px; overflow-y: auto; overflow-x: hidden;">
                        <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><div class="mt-2 text-muted">Đang tải...</div></div>
                    </div>
                    <div class="bg-light p-3 rounded-3 mt-4">
                        <div class="d-flex justify-content-between mb-2 text-muted">
                            <span>Tạm tính:</span>
                            <span id="cart-subtotal-display">...</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Phí vận chuyển:</span>
                            <span>Miễn phí</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top border-secondary-subtle">
                            <span class="fs-5 fw-bold text-dark">Tổng cộng:</span>
                            <span class="fs-3 fw-bold text-danger" id="cart-subtotal">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <style>
            /* Custom Scrollbar for cart items */
            #checkout-cart-items::-webkit-scrollbar { width: 6px; }
            #checkout-cart-items::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
            #checkout-cart-items::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
            #checkout-cart-items::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
            
            /* Radio button sync */
            .form-check-input:checked + label .text-dark { color: #0d6efd !important; }
        </style>

        <script>
            // Sync radio to hidden input
            document.querySelectorAll('input[name="paymentMethodRadio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    document.getElementById('paymentMethod').value = this.value;
                });
            });

            // Independent load function for Checkout page to avoid conflict with cart.js
            async function loadCheckoutCart() {
                try {
                    const response = await fetch('/carts');
                    const data = await response.json();
                    
                    if (!data.success) {
                        showToast(data.message || 'Lỗi tải giỏ hàng', 'danger');
                        return;
                    }
                    
                    const cart = data.data;
                    const container = document.getElementById('checkout-cart-items');
                    if (!container) return;
                    
                    container.innerHTML = '';
                    
                    let selectedIdsStr = sessionStorage.getItem('selectedCartItemIds');
                    let selectedIds = selectedIdsStr ? JSON.parse(selectedIdsStr) : [];
                    
                    let itemsToRender = [];
                    if (cart.items && cart.items.length > 0) {
                        if (selectedIds.length > 0) {
                            itemsToRender = cart.items.filter(item => selectedIds.includes(item.id));
                        } else {
                            itemsToRender = cart.items;
                        }
                    }
                    
                    if (itemsToRender.length === 0) {
                        container.innerHTML = '<div class="alert alert-warning text-center border-0 shadow-sm"><i class="bi bi-exclamation-circle fs-4 d-block mb-2"></i>Giỏ hàng trống hoặc chưa chọn sản phẩm. Vui lòng quay lại giỏ hàng.</div>';
                        document.getElementById('cart-subtotal').innerText = '0 đ';
                        document.getElementById('cart-subtotal-display').innerText = '0 đ';
                        document.getElementById('btn-checkout').disabled = true;
                        return;
                    }
                    
                    let newSubTotal = 0;
                    
                    itemsToRender.forEach(item => {
                        newSubTotal += item.itemTotal;
                        const div = document.createElement('div');
                        div.className = 'd-flex align-items-center mb-3 bg-white p-3 rounded-3 border border-light-subtle shadow-sm position-relative';
                        div.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
                        div.onmouseover = () => { div.style.transform = 'translateY(-2px)'; div.className = 'd-flex align-items-center mb-3 bg-white p-3 rounded-3 border border-primary-subtle shadow position-relative'; };
                        div.onmouseout = () => { div.style.transform = 'translateY(0)'; div.className = 'd-flex align-items-center mb-3 bg-white p-3 rounded-3 border border-light-subtle shadow-sm position-relative'; };
                        
                        const imgSrc = item.imageUrl || 'https://via.placeholder.com/70?text=No+Image';
                        const productName = item.productName || 'Sản phẩm ' + item.sku;
                        const variantInfo = (item.colorName && item.sizeName) ? `${item.colorName} / Size ${item.sizeName}` : `Mã: ${item.sku}`;
                        const localFormatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

                        div.innerHTML = `
                            <div class="flex-shrink-0 position-relative me-3">
                                <img src="${imgSrc}" class="rounded-3 border border-light" style="width: 75px; height: 75px; object-fit: contain; background: #fff;">
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-dark border border-white shadow-sm d-flex align-items-center justify-content-center" style="width: 22px; height: 22px; font-size: 0.75rem; padding: 0;">
                                    ${item.quantity}
                                </span>
                            </div>
                            <div class="flex-grow-1 min-w-0 pe-2">
                                <h6 class="mb-1 text-truncate fw-bold text-dark" style="font-size: 0.95rem; line-height: 1.4;">${productName}</h6>
                                <small class="text-muted d-block text-truncate mb-2"><i class="bi bi-tag me-1"></i>${variantInfo}</small>
                                <div class="fw-bold text-danger">${localFormatVND(item.itemTotal)}</div>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    
                    const localFormatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
                    const formattedSubTotal = localFormatVND(newSubTotal);
                    document.getElementById('cart-subtotal').innerText = formattedSubTotal;
                    document.getElementById('cart-subtotal-display').innerText = formattedSubTotal;
                } catch (error) {
                    console.error('Error loading checkout cart:', error);
                    showToast('Lỗi kết nối khi tải giỏ hàng', 'danger');
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadCheckoutCart();
            });
        </script>
    </section>
</body>
</html>
