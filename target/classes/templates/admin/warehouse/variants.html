<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quản lý Kho hàng - Biến thể</title>
</head>
<body>
    <section>
        <div class="mb-4">
            <a href="/admin/products" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Quay lại danh sách sản phẩm</a>
            <h2 class="h4 mt-2">Quản lý Biến thể: <span class="text-primary" th:text="${product.name}"></span></h2>
            <div class="text-muted small" th:text="'Mã SP: ' + ${product.code}"></div>
        </div>

        <div class="row">
            <!-- Form Thêm Biến thể -->
            <div class="col-lg-4 mb-4">
                <div class="card border-0 shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header bg-white fw-bold">
                        Thêm Biến thể mới
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/warehouse/variant/add}" th:object="${variantRequest}" method="post">
                            <input type="hidden" th:field="*{productId}">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mã SKU (Tùy chọn)</label>
                                <input type="text" class="form-control form-control-sm" th:field="*{sku}" placeholder="VD: SP01-RED-40">
                                <div class="form-text" style="font-size: 0.75rem;">Sẽ tự động sinh nếu để trống.</div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-bold">Màu sắc <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" th:field="*{colorId}" required>
                                        <option value="">- Chọn Màu -</option>
                                        <option th:each="c : ${colors}" th:value="${c.id}" th:text="${c.name}"></option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold">Kích cỡ <span class="text-danger">*</span></label>
                                    <select class="form-select form-select-sm" th:field="*{sizeId}" required>
                                        <option value="">- Chọn Size -</option>
                                        <option th:each="s : ${sizes}" th:value="${s.id}" th:text="${s.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Giá gốc (VNĐ) <span class="text-danger">*</span></label>
                                <div class="input-group input-group-sm">
                                    <input type="number" class="form-control" th:field="*{price}" required min="0" step="1000">
                                    <span class="input-group-text">₫</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Giá khuyến mãi (VNĐ)</label>
                                <div class="input-group input-group-sm">
                                    <input type="number" class="form-control" th:field="*{salePrice}" min="0" step="1000">
                                    <span class="input-group-text">₫</span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Số lượng tồn kho <span class="text-danger">*</span></label>
                                <input type="number" class="form-control form-control-sm" th:field="*{stockQuantity}" required min="0">
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="activeSwitch" checked>
                                <label class="form-check-label" for="activeSwitch">Mở bán biến thể này</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm Biến thể</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Danh sách Biến thể hiện có -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                        <span>Danh sách Biến thể</span>
                        <span class="badge bg-secondary rounded-pill" th:text="${variants.size()} + ' biến thể'"></span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>SKU</th>
                                        <th>Màu / Size</th>
                                        <th>Giá bán</th>
                                        <th>Tồn kho</th>
                                        <th>Trạng thái</th>
                                        <th class="text-end">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="variant : ${variants}">
                                        <td><span class="badge bg-light text-dark border" th:text="${variant.sku}"></span></td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div th:if="${variant.colorHex != null}" class="rounded-circle border me-2" th:style="'width: 15px; height: 15px; background-color: ' + ${variant.colorHex}"></div>
                                                <span th:text="${variant.colorName} + ' / Size ' + ${variant.sizeName}"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <div th:if="${variant.salePrice != null}">
                                                <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(variant.salePrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span><br>
                                                <del class="text-muted small" th:text="${#numbers.formatDecimal(variant.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></del>
                                            </div>
                                            <div th:unless="${variant.salePrice != null}">
                                                <span class="fw-bold" th:text="${#numbers.formatDecimal(variant.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
                                            </div>
                                        </td>
                                        <td>
                                            <span th:if="${variant.stockQuantity > 10}" class="badge bg-success" th:text="${variant.stockQuantity}"></span>
                                            <span th:if="${variant.stockQuantity > 0 and variant.stockQuantity <= 10}" class="badge bg-warning text-dark" th:text="${variant.stockQuantity}"></span>
                                            <span th:if="${variant.stockQuantity == 0}" class="badge bg-danger">Hết hàng</span>
                                        </td>
                                        <td>
                                            <i th:if="${variant.isActive}" class="bi bi-check-circle-fill text-success" title="Đang bán"></i>
                                            <i th:unless="${variant.isActive}" class="bi bi-x-circle-fill text-danger" title="Ngừng bán"></i>
                                        </td>
                                        <td class="text-end">
                                            <!-- Nút Cập nhật nhanh (Mở modal) -->
                                            <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#editModal' + ${variant.id}"><i class="bi bi-pencil"></i></button>
                                            <!-- Nút Xóa -->
                                            <a th:href="@{/admin/warehouse/variant/delete/{id}(id=${variant.id}, productId=${product.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa biến thể này?');"><i class="bi bi-trash"></i></a>
                                            
                                            <!-- Modal Cập nhật nhanh -->
                                            <div class="modal fade" th:id="'editModal' + ${variant.id}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog text-start">
                                                    <div class="modal-content">
                                                        <div class="modal-header">
                                                            <h5 class="modal-title">Cập nhật Biến thể</h5>
                                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                        </div>
                                                        <form th:action="@{/admin/warehouse/variant/update/{id}(id=${variant.id})}" method="post">
                                                            <div class="modal-body">
                                                                <input type="hidden" name="productId" th:value="${product.id}">
                                                                <input type="hidden" name="colorId" th:value="${variant.colorId}">
                                                                <input type="hidden" name="sizeId" th:value="${variant.sizeId}">
                                                                
                                                                <div class="mb-3">
                                                                    <label class="form-label">SKU</label>
                                                                    <input type="text" class="form-control" name="sku" th:value="${variant.sku}">
                                                                </div>
                                                                <div class="row mb-3">
                                                                    <div class="col-6">
                                                                        <label class="form-label">Giá gốc</label>
                                                                        <input type="number" class="form-control" name="price" th:value="${variant.price}" required min="0">
                                                                    </div>
                                                                    <div class="col-6">
                                                                        <label class="form-label">Giá khuyến mãi</label>
                                                                        <input type="number" class="form-control" name="salePrice" th:value="${variant.salePrice}" min="0">
                                                                    </div>
                                                                </div>
                                                                <div class="row mb-3">
                                                                    <div class="col-6">
                                                                        <label class="form-label">Tồn kho</label>
                                                                        <input type="number" class="form-control" name="stockQuantity" th:value="${variant.stockQuantity}" required min="0">
                                                                    </div>
                                                                    <div class="col-6">
                                                                        <label class="form-label d-block">Trạng thái</label>
                                                                        <div class="form-check form-switch mt-2">
                                                                            <input class="form-check-input" type="checkbox" name="isActive" th:checked="${variant.isActive}">
                                                                            <label class="form-check-label">Mở bán</label>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                                                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(variants)}">
                                        <td colspan="6" class="text-center text-muted py-5">
                                            <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                                            Sản phẩm này chưa có biến thể nào.<br>Hãy thêm biến thể ở form bên trái!
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
