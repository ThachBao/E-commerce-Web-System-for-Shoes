 <!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Sản Phẩm - ShoeStore</title>
</head>
<body>
    <section class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-dark">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>

        <div class="row overflow-hidden py-2">
            <!-- Sidebar Lọc -->
            <div class="col-lg-3 mb-4 reveal reveal-left">
                <div class="card border-0 shadow-sm rounded-4" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-4 gap-2">
                            <i class="bi bi-sliders text-warning fs-5"></i>
                            <h5 class="card-title fw-bold m-0" style="font-size: 1.15rem;">BỘ LỌC</h5>
                        </div>
                        <form action="/products" method="get">
                            <!-- Giữ lại keyword nếu có -->
                            <input type="hidden" name="keyword" th:value="${param.keyword}">
                            
                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.8rem; letter-spacing: 0.8px; color: #64748b;">Danh mục</h6>
                                <div class="form-check mb-2" th:each="cat : ${categories}">
                                    <input class="form-check-input" type="radio" name="categoryId" th:value="${cat.id}" th:id="'cat' + ${cat.id}" th:checked="${param.categoryId != null and param.categoryId[0] == cat.id.toString()}">
                                    <label class="form-check-label text-muted small fw-medium" th:for="'cat' + ${cat.id}" th:text="${cat.name}"></label>
                                </div>
                            </div>
                            
                            <div class="border-bottom my-3" style="border-color: #f1f5f9 !important;"></div>

                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.8rem; letter-spacing: 0.8px; color: #64748b;">Thương hiệu</h6>
                                <div class="form-check mb-2" th:each="br : ${brands}">
                                    <input class="form-check-input" type="radio" name="brandId" th:value="${br.id}" th:id="'br' + ${br.id}" th:checked="${param.brandId != null and param.brandId[0] == br.id.toString()}">
                                    <label class="form-check-label text-muted small fw-medium" th:for="'br' + ${br.id}" th:text="${br.name}"></label>
                                </div>
                            </div>
                            
                            <div class="border-bottom my-3" style="border-color: #f1f5f9 !important;"></div>

                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.8rem; letter-spacing: 0.8px; color: #64748b;">Giới tính</h6>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="MEN" id="g1" th:checked="${param.gender != null and param.gender[0] == 'MEN'}">
                                    <label class="form-check-label text-muted small fw-medium" for="g1">Nam</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="WOMEN" id="g2" th:checked="${param.gender != null and param.gender[0] == 'WOMEN'}">
                                    <label class="form-check-label text-muted small fw-medium" for="g2">Nữ</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="UNISEX" id="g3" th:checked="${param.gender != null and param.gender[0] == 'UNISEX'}">
                                    <label class="form-check-label text-muted small fw-medium" for="g3">Unisex</label>
                                </div>
                            </div>

                            <div class="d-grid gap-2 pt-2">
                                <button type="submit" class="btn btn-warning btn-hover-lift">Áp dụng bộ lọc</button>
                                <a href="/products" class="btn btn-outline-secondary btn-hover-lift">Xóa bộ lọc</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Danh sách Sản phẩm -->
            <div class="col-lg-9 reveal reveal-right">
                <!-- Sắp xếp & Hiển thị thông tin -->
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded-4 shadow-sm">
                    <div>
                        <span class="text-muted small" th:if="${param.keyword != null}">Kết quả tìm kiếm cho: <strong class="text-dark" th:text="${param.keyword}"></strong></span>
                        <span class="text-muted small" th:unless="${param.keyword != null}">Khám phá toàn bộ bộ sưu tập giày của chúng tôi</span>
                    </div>
                </div>

                <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
                    <div class="col" th:each="product : ${products}">
                        <div class="card product-card">
                            <div class="card-img-container" style="height: 260px;">
                                <a th:href="@{/products/{slug}(slug=${product.slug})}">
                                    <img th:if="${product.thumbnailUrl != null}" th:src="${product.thumbnailUrl}" class="w-100 h-100 product-img" alt="Product" style="object-fit: cover;">
                                    <img th:unless="${product.thumbnailUrl != null}" src="https://via.placeholder.com/260x260?text=No+Image" class="w-100 h-100 product-img" style="object-fit: cover;">
                                </a>
                            </div>
                            <div class="card-body">
                                <div class="text-muted mb-1" style="font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;" th:text="${product.brandName ?: 'Thương hiệu'}">Brand</div>
                                <h5 class="card-title text-truncate">
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}" class="text-decoration-none fw-bold" th:text="${product.name}">Tên SP</a>
                                </h5>
                                <div class="mt-auto pt-2 d-flex justify-content-between align-items-center">
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-sm btn-outline-warning btn-hover-lift py-1.5 px-3 rounded-pill">Xem chi tiết</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
                    <i class="bi bi-search fs-1 text-muted mb-3 d-block"></i>
                    <h5 class="fw-bold">Không tìm thấy sản phẩm nào phù hợp</h5>
                    <a href="/products" class="btn btn-warning btn-hover-lift mt-3">Xem tất cả sản phẩm</a>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center gap-1">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link rounded-3 border-0 shadow-sm" th:href="@{/products(page=${currentPage - 1}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link rounded-3 border-0 shadow-sm" th:href="@{/products(page=${i}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link rounded-3 border-0 shadow-sm" th:href="@{/products(page=${currentPage + 1}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</body>
</html>
