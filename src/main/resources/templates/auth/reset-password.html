<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đặt lại mật khẩu mới | ShoeStore</title>
</head>
<body>
<section class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key text-warning fs-1 mb-3 d-inline-block p-3 bg-light rounded-circle"></i>
                        <h3 class="fw-bold">Đặt lại mật khẩu</h3>
                        <p class="text-muted mt-2">Vui lòng nhập mật khẩu mới cực kỳ bảo mật cho tài khoản của bạn.</p>
                    </div>

                    <!-- Lỗi hiển thị nếu hai mật khẩu không trùng khớp -->
                    <div id="errorAlert" class="alert alert-danger py-2 small fw-medium d-none">
                        <i class="bi bi-exclamation-circle-fill me-1"></i> Mật khẩu xác nhận không khớp!
                    </div>
                    
                    <form action="/reset-password" method="post" id="resetPasswordForm" onsubmit="return validatePasswords()">
                        <input type="hidden" name="token" th:value="${token}">
                        
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control rounded-pill px-4" id="password" name="password" placeholder="Mật khẩu mới" required minlength="6">
                            <label for="password" class="px-4">Mật khẩu mới</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control rounded-pill px-4" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" required>
                            <label for="confirmPassword" class="px-4">Xác nhận mật khẩu</label>
                        </div>
                        
                        <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold text-uppercase mb-3 btn-reset">
                            Lưu mật khẩu mới
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validatePasswords() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('errorAlert');

            if (password !== confirmPassword) {
                alertBox.classList.remove('d-none');
                return false;
            }
            alertBox.classList.add('d-none');
            return true;
        }
    </script>

    <style>
        .btn-reset {
            transition: all 0.3s ease;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background-color: #ffc107 !important;
            color: #000 !important;
            border-color: #ffc107 !important;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ffc107;
        }
    </style>
</section>
</body>
</html>
