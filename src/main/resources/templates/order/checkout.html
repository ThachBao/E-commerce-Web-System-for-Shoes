<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .cart-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 24px;
        }
    </style>
</head>
<body>

    <div class="container mt-4 mb-5">
        <div class="mb-4">
            <a href="/cart-ui" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Quay lại giỏ hàng</a>
            <h2 class="fw-bold mt-3">Thủ tục thanh toán</h2>
        </div>
        
        <div class="row">
            <div class="col-lg-7">
                <div class="cart-container shadow-sm border border-light">
                    <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-truck"></i> Thông tin giao hàng</h5>
                    <form id="form-checkout">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và tên người nhận</label>
                            <input type="text" class="form-control bg-light" id="shippingFullName" required value="Customer Test 01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="tel" class="form-control bg-light" id="shippingPhone" required value="0987654321">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ nhận hàng (Chi tiết)</label>
                            <input type="text" class="form-control bg-light" id="shippingAddress" required value="123 Nguyễn Văn Cừ, Quận 5, TP.HCM">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Ghi chú (Tùy chọn)</label>
                            <textarea class="form-control bg-light" id="note" rows="3" placeholder="Ví dụ: Giao hàng giờ hành chính..."></textarea>
                        </div>
                        
                        <h5 class="fw-bold mb-4 mt-5 border-bottom pb-3"><i class="bi bi-credit-card"></i> Phương thức thanh toán</h5>
                        <div class="mb-4">
                            <select class="form-select bg-light" id="paymentMethod" required>
                                <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                                <option value="BANK_TRANSFER">Chuyển khoản qua ngân hàng</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold mt-3" id="btn-checkout">
                            XÁC NHẬN ĐẶT HÀNG
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5 mt-4 mt-lg-0">
                <div class="cart-container shadow-sm border border-light bg-light">
                    <h5 class="fw-bold mb-4"><i class="bi bi-receipt"></i> Tóm tắt đơn hàng</h5>
                    <div id="cart-items" class="mb-4">
                        <div class="text-center"><div class="spinner-border text-secondary spinner-border-sm"></div></div>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-semibold">Tổng thanh toán:</span>
                        <span class="fs-4 fw-bold text-danger" id="cart-subtotal">...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/cart.js}"></script>
    <script>
        // Override renderCart to fit the small summary box on checkout page
        renderCart = (cart) => {
            const container = document.getElementById('cart-items');
            if (!container) return;
            
            container.innerHTML = '';
            
            let selectedIdsStr = sessionStorage.getItem('selectedCartItemIds');
            let selectedIds = selectedIdsStr ? JSON.parse(selectedIdsStr) : [];
            
            let itemsToRender = [];
            if (cart.items && cart.items.length > 0) {
                if (selectedIds.length > 0) {
                    itemsToRender = cart.items.filter(item => selectedIds.includes(item.id));
                } else {
                    itemsToRender = cart.items; // Fallback
                }
            }
            
            if (itemsToRender.length === 0) {
                container.innerHTML = '<div class="alert alert-warning text-center">Giỏ hàng trống hoặc chưa chọn sản phẩm. Vui lòng quay lại giỏ hàng.</div>';
                document.getElementById('cart-subtotal').innerText = '0 đ';
                document.getElementById('btn-checkout').disabled = true;
                return;
            }
            
            let newSubTotal = 0;
            
            itemsToRender.forEach(item => {
                newSubTotal += item.itemTotal;
                const div = document.createElement('div');
                div.className = 'd-flex justify-content-between align-items-center mb-3 bg-white p-2 rounded border shadow-sm';
                div.innerHTML = `
                    <div>
                        <h6 class="mb-1 text-truncate fw-bold" style="max-width: 220px;">${item.sku || ('Variant #' + item.variantId)}</h6>
                        <span class="badge bg-secondary">SL: ${item.quantity}</span>
                    </div>
                    <div class="fw-bold text-dark">${formatVND(item.itemTotal)}</div>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('cart-subtotal').innerText = formatVND(newSubTotal);
        };
    </script>
</body>
</html>
