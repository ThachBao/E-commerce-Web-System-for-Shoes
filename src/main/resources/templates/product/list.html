 <!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Sản Phẩm - ShoeStore</title>
</head>
<body>
    <section class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-dark">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
            </ol>
        </nav>

        <div class="row">
            <!-- Sidebar Lọc -->
            <div class="col-lg-3 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-4">Bộ Lọc</h5>
                        <form action="/products" method="get">
                            <!-- Giữ lại keyword nếu có -->
                            <input type="hidden" name="keyword" th:value="${param.keyword}">
                            
                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase fs-7 mb-3">Danh mục</h6>
                                <div class="form-check mb-2" th:each="cat : ${categories}">
                                    <input class="form-check-input" type="radio" name="categoryId" th:value="${cat.id}" th:id="'cat' + ${cat.id}" th:checked="${param.categoryId != null and param.categoryId[0] == cat.id.toString()}">
                                    <label class="form-check-label text-muted" th:for="'cat' + ${cat.id}" th:text="${cat.name}"></label>
                                </div>
                            </div>
                            
                            <hr class="text-muted">

                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase fs-7 mb-3">Thương hiệu</h6>
                                <div class="form-check mb-2" th:each="br : ${brands}">
                                    <input class="form-check-input" type="radio" name="brandId" th:value="${br.id}" th:id="'br' + ${br.id}" th:checked="${param.brandId != null and param.brandId[0] == br.id.toString()}">
                                    <label class="form-check-label text-muted" th:for="'br' + ${br.id}" th:text="${br.name}"></label>
                                </div>
                            </div>
                            
                            <hr class="text-muted">

                            <div class="mb-4">
                                <h6 class="fw-bold text-uppercase fs-7 mb-3">Giới tính</h6>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="MEN" id="g1" th:checked="${param.gender != null and param.gender[0] == 'MEN'}">
                                    <label class="form-check-label text-muted" for="g1">Nam</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="WOMEN" id="g2" th:checked="${param.gender != null and param.gender[0] == 'WOMEN'}">
                                    <label class="form-check-label text-muted" for="g2">Nữ</label>
                                </div>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="radio" name="gender" value="UNISEX" id="g3" th:checked="${param.gender != null and param.gender[0] == 'UNISEX'}">
                                    <label class="form-check-label text-muted" for="g3">Unisex</label>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark">Áp dụng</button>
                                <a href="/products" class="btn btn-outline-secondary">Xóa lọc</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Danh sách Sản phẩm -->
            <div class="col-lg-9">
                <!-- Sắp xếp & Hiển thị thông tin -->
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
                    <div>
                        <span class="text-muted" th:if="${param.keyword != null}">Kết quả tìm kiếm cho: <strong class="text-dark" th:text="${param.keyword}"></strong></span>
                    </div>
                </div>

                <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
                    <div class="col" th:each="product : ${products}">
                        <div class="card h-100 border-0 shadow-sm product-card">
                            <img th:if="${product.thumbnailUrl != null}" th:src="${product.thumbnailUrl}" class="card-img-top" alt="Product" style="height: 250px; object-fit: cover;">
                            <img th:unless="${product.thumbnailUrl != null}" src="https://via.placeholder.com/250x250?text=No+Image" class="card-img-top" style="height: 250px; object-fit: cover;">
                            <div class="card-body text-center">
                                <div class="text-muted small mb-1" th:text="${product.brandName ?: 'Khác'}">Brand</div>
                                <h5 class="card-title text-truncate">
                                    <a th:href="@{/products/{slug}(slug=${product.slug})}" class="text-dark text-decoration-none fw-bold" th:text="${product.name}">Tên SP</a>
                                </h5>
                                <p class="text-danger fw-bold mb-0">Xem chi tiết</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(products)}" class="text-center py-5">
                    <i class="bi bi-search fs-1 text-muted mb-3 d-block"></i>
                    <h4>Không tìm thấy sản phẩm nào phù hợp</h4>
                    <a href="/products" class="btn btn-outline-dark mt-3">Xem tất cả sản phẩm</a>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${currentPage - 1}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/products(page=${i}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${currentPage + 1}, keyword=${param.keyword}, categoryId=${param.categoryId}, brandId=${param.brandId}, gender=${param.gender})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</body>
</html>
