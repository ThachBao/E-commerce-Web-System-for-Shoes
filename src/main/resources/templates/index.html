<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Trang Chủ - ShoeStore</title>
</head>
<body>
    <section>
        <!-- Banner Carousel -->
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" style="height: 400px; background-color: #212529;">
                    <div class="container h-100 d-flex align-items-center">
                        <div class="text-white w-50">
                            <h1 class="display-4 fw-bold">BST Mùa Hè 2026</h1>
                            <p class="lead">Khám phá những mẫu giày mới nhất với thiết kế đột phá, mang lại sự thoải mái tuyệt đối.</p>
                            <a href="/products" class="btn btn-warning btn-lg mt-3">Mua ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-5">
            <!-- Sản phẩm nổi bật -->
            <div class="text-center mb-5">
                <h2 class="fw-bold text-uppercase">Sản Phẩm Nổi Bật</h2>
                <div class="mx-auto bg-warning" style="height: 3px; width: 50px;"></div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <!-- Vòng lặp hiển thị sản phẩm -->
                <div class="col" th:each="product : ${featuredProducts}">
                    <div class="card h-100 border-0 shadow-sm product-card">
                        <div class="position-relative">
                            <img th:if="${product.thumbnailUrl != null}" th:src="${product.thumbnailUrl}" class="card-img-top" alt="Product Image" style="height: 250px; object-fit: cover;">
                            <img th:unless="${product.thumbnailUrl != null}" src="https://via.placeholder.com/250x250?text=No+Image" class="card-img-top" alt="No Image" style="height: 250px; object-fit: cover;">
                            <!-- Tag Nổi bật -->
                            <span class="position-absolute top-0 start-0 badge bg-danger m-2 px-2 py-1">Hot</span>
                        </div>
                        <div class="card-body text-center">
                            <div class="text-muted small mb-1" th:text="${product.brandName ?: 'Khác'}">Brand</div>
                            <h5 class="card-title text-truncate">
                                <a th:href="@{/products/{slug}(slug=${product.slug})}" class="text-dark text-decoration-none fw-bold" th:text="${product.name}">Tên sản phẩm</a>
                            </h5>
                            <!-- Tạm thời để giá mẫu nếu chưa tích hợp logic tính giá từ Variant vào DTO của Product -->
                            <p class="text-danger fw-bold mb-0">Xem chi tiết</p>
                        </div>
                        <div class="card-footer bg-white border-top-0 p-3 text-center">
                            <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-outline-dark w-100">Chi tiết</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(featuredProducts)}" class="text-center text-muted py-5">
                <p>Chưa có sản phẩm nổi bật nào.</p>
            </div>
            
            <div class="text-center mt-5">
                <a href="/products" class="btn btn-dark px-4 py-2">Xem tất cả sản phẩm</a>
            </div>
        </div>
    </section>
</body>
</html>
