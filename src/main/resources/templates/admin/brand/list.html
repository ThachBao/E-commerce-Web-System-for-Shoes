<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quản lý Thương hiệu</title>
</head>
<body>
    <section>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 m-0">Quản lý Thương hiệu</h2>
            <a href="/admin/brands/add" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Thêm Thương hiệu</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <!-- Form Tìm kiếm -->
                <form action="/admin/brands" method="get" class="mb-4">
                    <div class="input-group w-50">
                        <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo tên..." th:value="${keyword}">
                        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i> Tìm kiếm</button>
                        <a href="/admin/brands" class="btn btn-outline-danger" th:if="${keyword != null and keyword != ''}"><i class="bi bi-x"></i></a>
                    </div>
                </form>

                <!-- Bảng dữ liệu -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Logo</th>
                                <th>Mã TH</th>
                                <th>Tên Thương hiệu</th>
                                <th>Mô tả</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="brand : ${brands}">
                                <td>
                                    <img th:if="${brand.logoUrl != null}" th:src="${brand.logoUrl}" alt="Logo" class="img-thumbnail" style="width: 50px; height: 50px; object-fit: contain;">
                                    <span th:unless="${brand.logoUrl != null}" class="text-muted"><i class="bi bi-image"></i></span>
                                </td>
                                <td><span class="badge bg-secondary" th:text="${brand.code}"></span></td>
                                <td class="fw-bold" th:text="${brand.name}"></td>
                                <td th:text="${brand.description != null ? (brand.description.length() > 50 ? brand.description.substring(0, 50) + '...' : brand.description) : '-'}"></td>
                                <td>
                                    <span th:if="${brand.isActive}" class="badge bg-success">Hoạt động</span>
                                    <span th:unless="${brand.isActive}" class="badge bg-danger">Khóa</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/brands/edit/{id}(id=${brand.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/admin/brands/delete/{id}(id=${brand.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Bạn có chắc chắn muốn xóa?');"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(brands)}">
                                <td colspan="6" class="text-center text-muted py-4">Không tìm thấy dữ liệu nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/brands(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/brands(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/brands(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </section>
</body>
</html>
