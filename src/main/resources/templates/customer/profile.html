<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Hồ sơ cá nhân | ShoeStore</title>
</head>
<body>
<section class="py-5 bg-light">
    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb bg-transparent p-0">
                        <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-dark">Trang chủ</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Hồ sơ cá nhân</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${user.fullName}">Tên người dùng</h5>
                        <p class="text-muted small mb-3" th:text="${user.email}">email@example.com</p>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex flex-column gap-2 text-start">
                            <a href="/profile" class="btn btn-dark w-100 text-start py-2 px-3 fw-medium">
                                <i class="bi bi-person me-2"></i> Thông tin cá nhân
                            </a>
                            <a href="/orders" class="btn btn-outline-secondary border-0 w-100 text-start py-2 px-3 fw-medium text-dark">
                                <i class="bi bi-bag-check me-2"></i> Lịch sử đơn hàng
                            </a>
                            <form action="/logout" method="post" class="mt-2">
                                <button type="submit" class="btn btn-outline-danger border-0 w-100 text-start py-2 px-3 fw-medium">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Details -->
            <div class="col-lg-9 col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                            <h3 class="fw-bold mb-0">Thông tin cá nhân</h3>
                            <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                <i class="bi bi-pencil-square me-2"></i>Chỉnh sửa
                            </button>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small text-uppercase">Họ và tên</label>
                                <div class="form-control bg-light fs-5 py-2 border-0" th:text="${user.fullName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small text-uppercase">Tên đăng nhập</label>
                                <div class="form-control bg-light fs-5 py-2 border-0" th:text="${user.username}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small text-uppercase">Email</label>
                                <div class="form-control bg-light fs-5 py-2 border-0" th:text="${user.email}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small text-uppercase">Số điện thoại</label>
                                <div class="form-control bg-light fs-5 py-2 border-0" th:text="${user.phone != null ? user.phone : 'Chưa cập nhật'}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-bold small text-uppercase">Vai trò</label>
                                <div class="form-control bg-light fs-5 py-2 border-0">
                                    <span class="badge bg-primary" th:text="${user.role == 'ROLE_ADMIN' ? 'Quản trị viên' : 'Khách hàng'}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Edit Profile Modal -->
<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                <h5 class="modal-title fw-bold" id="editProfileModalLabel">Chỉnh sửa hồ sơ</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="/profile/update" method="post">
                <div class="modal-body px-4 py-4">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small text-uppercase">Họ và tên</label>
                        <input type="text" class="form-control bg-light" name="fullName" th:value="${user.fullName}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small text-uppercase">Email</label>
                        <input type="email" class="form-control bg-light" name="email" th:value="${user.email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small text-uppercase">Số điện thoại</label>
                        <input type="tel" class="form-control bg-light" name="phone" th:value="${user.phone}">
                    </div>
                </div>
                <div class="modal-footer border-top-0 pb-4 px-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        /*[[${successMessage} != null]]*/
        var hasSuccess = /*[[${successMessage != null}]]*/ false;
        var successMsg = /*[[${successMessage}]]*/ '';
        
        if (hasSuccess) {
            showToast(successMsg, 'success');
        }
    });
</script>
</body>
</html>
