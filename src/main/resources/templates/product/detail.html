<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${product.name} + ' - ShoeStore'">Chi tiết sản phẩm</title>
</head>
<body>
    <section class="container py-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-dark">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/products" class="text-decoration-none text-dark">Sản phẩm</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Tên SP</li>
            </ol>
        </nav>

        <div class="row bg-white p-4 rounded shadow-sm mb-5">
            <!-- Hình ảnh sản phẩm -->
            <div class="col-md-6 mb-4 mb-md-0">
                <div class="mb-3 text-center bg-light rounded" style="height: 400px; display: flex; align-items: center; justify-content: center;">
                    <img th:if="${product.thumbnailUrl != null}" th:src="${product.thumbnailUrl}" class="img-fluid rounded" alt="Thumbnail" style="max-height: 100%; object-fit: contain;" id="mainImage">
                    <span th:unless="${product.thumbnailUrl != null}" class="text-muted"><i class="bi bi-image" style="font-size: 5rem;"></i></span>
                </div>
                <!-- Gallery nhỏ -->
                <div class="d-flex gap-2 overflow-auto py-2" th:if="${product.thumbnailUrl != null or (product.imageUrls != null and !product.imageUrls.isEmpty())}">
                    <img th:if="${product.thumbnailUrl != null}" th:src="${product.thumbnailUrl}" class="img-thumbnail cursor-pointer gallery-img" style="width: 80px; height: 80px; object-fit: cover; cursor: pointer;" onclick="document.getElementById('mainImage').src=this.src;">
                    <img th:if="${product.imageUrls != null}" th:each="imgUrl : ${product.imageUrls}" th:src="${imgUrl}" class="img-thumbnail cursor-pointer gallery-img" style="width: 80px; height: 80px; object-fit: cover; cursor: pointer;" onclick="document.getElementById('mainImage').src=this.src;">
                </div>
            </div>

            <!-- Thông tin chi tiết -->
            <div class="col-md-6">
                <div class="mb-2">
                    <span class="badge bg-secondary" th:text="${product.brandName ?: 'Khác'}">Brand</span>
                    <span class="badge border text-dark ms-1" th:text="'Mã: ' + ${product.code}">Code</span>
                </div>
                <h1 class="h3 fw-bold mb-3" th:text="${product.name}">Tên Sản Phẩm</h1>
                
                <div class="mb-4 text-muted border-bottom pb-3" th:text="${product.description != null ? product.description : 'Chưa có mô tả cho sản phẩm này.'}">
                    Mô tả...
                </div>

                <form action="/cart/add" method="post" id="form-add-to-cart">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    
                    <!-- Chọn Biến thể (Màu và Size) -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Chọn Màu sắc & Kích cỡ:</label>
                        <select name="variantId" id="input-variant-id" class="form-select form-select-lg" required>
                            <option value="">-- Chọn một tùy chọn --</option>
                            <option th:each="variant : ${variants}" 
                                    th:value="${variant.id}" 
                                    th:data-price="${variant.salePrice != null ? variant.salePrice : variant.price}"
                                    th:data-original-price="${variant.salePrice != null ? variant.price : null}"
                                    th:text="${variant.colorName} + ' - Size ' + ${variant.sizeName} + ' (Còn ' + ${variant.stockQuantity} + ')'"
                                    th:disabled="${variant.stockQuantity <= 0}"></option>
                        </select>
                    </div>

                    <!-- Hiển thị giá động theo biến thể được chọn bằng Javascript (bên dưới) -->
                    <div class="mb-4 p-3 bg-light rounded" id="priceDisplay">
                        <span class="text-muted">Vui lòng chọn Màu & Size để xem giá.</span>
                    </div>

                    <div class="d-flex gap-2 mb-4">
                        <div style="width: 120px;">
                            <label class="form-label fw-bold">Số lượng:</label>
                            <input type="number" name="quantity" id="input-quantity" class="form-control form-control-lg text-center" value="1" min="1" required>
                        </div>
                        <div class="flex-grow-1 align-self-end d-flex gap-2">
                            <button type="button" class="btn btn-warning btn-lg fw-bold flex-grow-1" id="btn-add-cart" onclick="addToCart(false)">
                                <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ
                            </button>
                            <button type="button" class="btn btn-dark btn-lg fw-bold flex-grow-1" id="btn-buy-now" onclick="addToCart(true)">
                                Mua ngay
                            </button>
                        </div>
                    </div>
                </form>

                <!-- Chính sách cửa hàng -->
                <div class="mt-5 border-top pt-3">
                    <ul class="list-unstyled mb-0 text-muted small">
                        <li class="mb-2"><i class="bi bi-truck me-2 text-dark"></i>Giao hàng miễn phí cho đơn hàng trên 1.000.000đ</li>
                        <li class="mb-2"><i class="bi bi-arrow-repeat me-2 text-dark"></i>Đổi trả trong vòng 7 ngày</li>
                        <li><i class="bi bi-shield-check me-2 text-dark"></i>Cam kết hàng chính hãng 100%</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Script xử lý thay đổi giá khi chọn biến thể -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const variantSelect = document.querySelector('select[name="variantId"]');
                const priceDisplay = document.getElementById('priceDisplay');

                variantSelect.addEventListener('change', function() {
                    const selectedOption = this.options[this.selectedIndex];
                    if (!selectedOption.value) {
                        priceDisplay.innerHTML = '<span class="text-muted">Vui lòng chọn Màu & Size để xem giá.</span>';
                        return;
                    }

                    const price = parseFloat(selectedOption.getAttribute('data-price'));
                    const originalPrice = selectedOption.getAttribute('data-original-price');
                    
                    const formatVND = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format;

                    let html = `<h2 class="text-danger fw-bold mb-0">${formatVND(price)}</h2>`;
                    
                    if (originalPrice && originalPrice !== 'null') {
                        html += `<div class="text-muted text-decoration-line-through small">${formatVND(parseFloat(originalPrice))}</div>`;
                    }

                    priceDisplay.innerHTML = html;
                });
            });

            // Handle Add to Cart / Buy Now via AJAX
            async function addToCart(isBuyNow) {
                const variantId = document.getElementById('input-variant-id').value;
                const quantity = document.getElementById('input-quantity').value;

                if (!variantId) {
                    showToast('Vui lòng chọn Màu sắc & Kích cỡ!', 'danger');
                    return;
                }

                if (!quantity || quantity < 1) {
                    showToast('Số lượng không hợp lệ!', 'danger');
                    return;
                }

                try {
                    const response = await fetch('/carts/items', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            variantId: parseInt(variantId),
                            quantity: parseInt(quantity)
                        })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        if (isBuyNow) {
                            // Fetch cart to get the cart item ID
                            const cartRes = await fetch('/carts');
                            const cartData = await cartRes.json();
                            if (cartData.success && cartData.data && cartData.data.items) {
                                // Find the cart item with this variantId
                                const cartItem = cartData.data.items.find(i => i.variantId === parseInt(variantId));
                                if (cartItem) {
                                    sessionStorage.setItem('selectedCartItemIds', JSON.stringify([cartItem.id]));
                                    window.location.href = '/checkout-ui';
                                    return;
                                }
                            }
                            // Fallback if not found
                            window.location.href = '/cart-ui';
                        } else {
                            showToast('Đã thêm sản phẩm vào giỏ hàng!', 'success');
                            // Update cart count if applicable
                            if(typeof updateCartCount === 'function') updateCartCount();
                        }
                    } else {
                        showToast(data.message || 'Lỗi khi thêm vào giỏ hàng', 'danger');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('Lỗi kết nối máy chủ', 'danger');
                }
            }
        </script>
    </section>
</body>
</html>
