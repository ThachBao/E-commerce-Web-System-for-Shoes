<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quản lý Màu sắc</title>
</head>
<body>
    <section>
        <div class="mb-4">
            <h2 class="h4 m-0">Quản lý Màu sắc</h2>
        </div>

        <div class="row">
            <!-- Cột Thêm mới -->
            <div class="col-md-4 mb-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white fw-bold">
                        Thêm Màu sắc mới
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/attributes/colors/add}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Tên màu <span class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control" required placeholder="VD: Đỏ">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Mã Hex</label>
                                <div class="input-group">
                                    <input type="color" name="hexCode" class="form-control form-control-color w-25" value="#ff0000" title="Chọn màu">
                                    <input type="text" class="form-control w-75" placeholder="#ff0000" readonly>
                                </div>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Thêm Màu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cột Danh sách -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <form action="/admin/attributes/colors" method="get" class="mb-3">
                            <div class="input-group w-50">
                                <input type="text" name="keyword" class="form-control form-control-sm" placeholder="Tìm kiếm..." th:value="${keyword}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
                                <a href="/admin/attributes/colors" class="btn btn-sm btn-outline-danger" th:if="${keyword != null and keyword != ''}"><i class="bi bi-x"></i></a>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên Màu</th>
                                        <th>Mã Hex</th>
                                        <th>Hiển thị</th>
                                        <th class="text-end">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="color : ${colors}">
                                        <td th:text="${color.id}"></td>
                                        <td class="fw-bold" th:text="${color.name}"></td>
                                        <td th:text="${color.hexCode ?: '-'}"></td>
                                        <td>
                                            <div th:if="${color.hexCode != null}" class="rounded-circle border" th:style="'width: 25px; height: 25px; background-color: ' + ${color.hexCode}"></div>
                                            <span th:unless="${color.hexCode != null}">-</span>
                                        </td>
                                        <td class="text-end">
                                            <button type="button" class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" th:data-bs-target="'#editColorModal' + ${color.id}"><i class="bi bi-pencil"></i></button>
                                            <a th:href="@{/admin/attributes/colors/delete/{id}(id=${color.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa màu sắc này?');"><i class="bi bi-trash"></i></a>
                                            
                                            <!-- Modal Edit Color -->
                                            <div class="modal fade text-start" th:id="'editColorModal' + ${color.id}" tabindex="-1" aria-hidden="true">
                                                <div class="modal-dialog">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/attributes/colors/edit/{id}(id=${color.id})}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Cập nhật Màu sắc</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>
                                                            <div class="modal-body">
                                                                <div class="mb-3">
                                                                    <label class="form-label">Tên màu <span class="text-danger">*</span></label>
                                                                    <input type="text" name="name" class="form-control" required th:value="${color.name}">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label">Mã Hex</label>
                                                                    <div class="input-group">
                                                                        <input type="color" name="hexCode" class="form-control form-control-color w-25" th:value="${color.hexCode ?: '#000000'}" title="Chọn màu">
                                                                        <input type="text" class="form-control w-75" th:value="${color.hexCode}" readonly>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                                                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(colors)}">
                                        <td colspan="5" class="text-center text-muted py-3">Không có dữ liệu.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Phân trang -->
                        <nav th:if="${totalPages > 1}" class="mt-3">
                            <ul class="pagination pagination-sm justify-content-center">
                                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/attributes/colors(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                                    <a class="page-link" th:href="@{/admin/attributes/colors(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                    <a class="page-link" th:href="@{/admin/attributes/colors(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
