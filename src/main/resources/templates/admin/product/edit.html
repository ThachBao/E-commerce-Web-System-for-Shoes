<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Cập nhật Sản phẩm</title>
</head>
<body>
    <section>
        <div class="mb-4">
            <a href="/admin/products" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
            <h2 class="h4 mt-2">Cập nhật Sản phẩm: <span th:text="${productCode}" class="text-primary"></span></h2>
        </div>

        <form th:action="@{/admin/products/edit/{id}(id=${productId})}" th:object="${productRequest}" method="post" enctype="multipart/form-data">
            <div class="row">
                <!-- Cột thông tin chính -->
                <div class="col-lg-8 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-bold">Thông tin cơ bản</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên Sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả chi tiết</label>
                                <textarea class="form-control" th:field="*{description}" rows="5"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột thông tin phụ -->
                <div class="col-lg-4 mb-4">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold">Phân loại</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option value="">- Chọn Danh mục -</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Thương hiệu</label>
                                <select class="form-select" th:field="*{brandId}">
                                    <option value="">- Không chọn -</option>
                                    <option th:each="br : ${brands}" th:value="${br.id}" th:text="${br.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Giới tính</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="UNISEX">Unisex</option>
                                    <option value="MEN">Nam</option>
                                    <option value="WOMEN">Nữ</option>
                                    <option value="KIDS">Trẻ em</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold">Hình ảnh & Tùy chọn</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ảnh đại diện hiện tại</label>
                                <div class="mb-2 text-center bg-light p-2 rounded">
                                    <img th:if="${thumbnailUrl != null}" th:src="${thumbnailUrl}" alt="Thumbnail" class="img-fluid" style="max-height: 150px;">
                                    <span th:unless="${thumbnailUrl != null}" class="text-muted">Chưa có ảnh</span>
                                </div>
                                <label class="form-label fw-bold mt-2">Đổi Ảnh đại diện</label>
                                <input type="file" class="form-control form-control-sm" name="thumbnailFile" accept="image/*">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Thêm ảnh bổ sung</label>
                                <input type="file" class="form-control form-control-sm" name="imageFiles" accept="image/*" multiple>
                            </div>
                            <hr>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isFeatured}" id="featuredSwitch">
                                <label class="form-check-label" for="featuredSwitch">Sản phẩm nổi bật</label>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="activeSwitch">
                                <label class="form-check-label" for="activeSwitch">Hoạt động (Hiển thị ra ngoài)</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-save me-1"></i> Lưu Thay Đổi</button>
                                <a th:href="@{/admin/warehouse/product/{id}(id=${productId})}" class="btn btn-outline-info"><i class="bi bi-box-seam me-1"></i> Quản lý Biến thể</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>
</body>
</html>
