<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/cart-ui"><i class="bi bi-box-seam"></i> ShoeStore</a>
            <span class="text-white ms-auto"><i class="bi bi-shield-lock"></i> Thanh toán an toàn</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="mb-4">
            <a href="/cart-ui" class="text-decoration-none text-muted"><i class="bi bi-arrow-left"></i> Quay lại giỏ hàng</a>
            <h2 class="fw-bold mt-3">Thủ tục thanh toán</h2>
        </div>
        
        <div class="row">
            <div class="col-lg-7">
                <div class="cart-container shadow-sm">
                    <h4 class="fw-bold mb-4 border-bottom pb-3"><i class="bi bi-truck"></i> Thông tin giao hàng</h4>
                    <form id="form-checkout">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Họ và tên người nhận</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="shippingFullName" required value="Customer Test 01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Số điện thoại</label>
                            <input type="tel" class="form-control form-control-lg bg-light" id="shippingPhone" required value="0987654321">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Địa chỉ nhận hàng (Chi tiết)</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="shippingAddress" required value="123 Nguyễn Văn Cừ, Quận 5, TP.HCM">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-muted">Ghi chú (Tùy chọn)</label>
                            <textarea class="form-control bg-light" id="note" rows="2" placeholder="Ví dụ: Giao hàng giờ hành chính..."></textarea>
                        </div>
                        
                        <h4 class="fw-bold mb-4 mt-5 border-bottom pb-3"><i class="bi bi-credit-card"></i> Phương thức thanh toán</h4>
                        <div class="mb-5">
                            <select class="form-select form-select-lg bg-light" id="paymentMethod" required>
                                <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                                <option value="BANK_TRANSFER">Chuyển khoản qua ngân hàng</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-dark btn-lg w-100 fw-bold py-3 fs-5" id="btn-checkout">
                            XÁC NHẬN ĐẶT HÀNG <i class="bi bi-check-circle ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="col-lg-5 mt-4 mt-lg-0">
                <div class="cart-container bg-light border border-secondary border-opacity-10 shadow-sm">
                    <h5 class="fw-bold mb-4"><i class="bi bi-receipt"></i> Tóm tắt đơn hàng</h5>
                    <div id="cart-items" class="mb-4">
                        <div class="text-center"><div class="spinner-border text-secondary spinner-border-sm"></div></div>
                    </div>
                    <hr class="text-secondary opacity-25">
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-semibold text-muted">Tổng thanh toán:</span>
                        <span class="fs-3 fw-bold text-danger" id="cart-subtotal">...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/cart.js}"></script>
    <script>
        // Override renderCart to fit the small summary box on checkout page
        renderCart = (cart) => {
            const container = document.getElementById('cart-items');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (!cart.items || cart.items.length === 0) {
                container.innerHTML = '<div class="alert alert-warning text-center">Giỏ hàng trống. Vui lòng quay lại giỏ hàng.</div>';
                document.getElementById('cart-subtotal').innerText = '0 đ';
                document.getElementById('btn-checkout').disabled = true;
                return;
            }
            
            cart.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'd-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded shadow-sm';
                div.innerHTML = `
                    <div>
                        <h6 class="mb-1 text-truncate fw-bold" style="max-width: 220px;">${item.sku || ('Variant #' + item.variantId)}</h6>
                        <span class="badge bg-secondary">SL: ${item.quantity}</span>
                    </div>
                    <div class="fw-bold text-dark fs-6">${formatVND(item.itemTotal)}</div>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('cart-subtotal').innerText = formatVND(cart.subTotal);
        };
    </script>
</body>
</html>
