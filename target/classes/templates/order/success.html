<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng thành công</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: 'Inter', sans-serif;">
    <div class="container mt-5 pt-5 text-center">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px; border-radius: 12px;">
            <div class="card-body p-5">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                <h2 class="fw-bold mt-4 mb-3">Đặt Hàng Thành Công!</h2>
                <p class="text-muted mb-4">Cảm ơn bạn đã tin tưởng mua sắm. Đơn hàng của bạn đã được hệ thống ghi nhận và đang được xử lý.</p>
                
                <div class="bg-light border rounded p-4 mb-4 text-start shadow-sm">
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                        <span class="text-muted">Mã đơn hàng:</span>
                        <span class="fw-bold text-dark fs-5" id="display-order-code">...</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Tổng thanh toán:</span>
                        <span class="fw-bold text-danger fs-4" id="display-total-amount">...</span>
                    </div>
                </div>

                <a href="/cart-ui" class="btn btn-dark btn-lg w-100 fw-bold py-3">QUAY LẠI GIỎ HÀNG <i class="bi bi-arrow-right-circle ms-2"></i></a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderCode = sessionStorage.getItem('lastOrderCode') || 'Không xác định';
            const totalAmount = sessionStorage.getItem('lastOrderTotal') || '0 đ';
            
            document.getElementById('display-order-code').innerText = orderCode;
            document.getElementById('display-total-amount').innerText = totalAmount;
            
            // Xóa dữ liệu tạm sau khi hiển thị
            sessionStorage.removeItem('lastOrderCode');
            sessionStorage.removeItem('lastOrderTotal');
        });
    </script>
</body>
</html>
