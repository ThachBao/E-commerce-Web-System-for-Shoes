<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            color: white;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .sidebar a:hover, .sidebar a.active {
            color: white;
            background-color: #495057;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-0 sidebar">
                <div class="p-3">
                    <h4><i class="bi bi-box-seam me-2"></i>ShoeStore</h4>
                </div>
                <hr class="mt-0 mb-3 text-secondary">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="/admin/products" class="nav-link"><i class="bi bi-bag me-2"></i>Sản phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/categories" class="nav-link"><i class="bi bi-tags me-2"></i>Danh mục</a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/brands" class="nav-link"><i class="bi bi-star me-2"></i>Thương hiệu</a>
                    </li>
                    <li class="nav-item">
                        <a href="#attributeSubmenu" data-bs-toggle="collapse" class="nav-link"><i class="bi bi-palette me-2"></i>Thuộc tính <i class="bi bi-caret-down-fill float-end mt-1"></i></a>
                        <ul class="collapse nav flex-column ms-3" id="attributeSubmenu">
                            <li class="nav-item"><a href="/admin/attributes/colors" class="nav-link"><i class="bi bi-circle-fill me-2"></i>Màu sắc</a></li>
                            <li class="nav-item"><a href="/admin/attributes/sizes" class="nav-link"><i class="bi bi-rulers me-2"></i>Kích cỡ</a></li>
                        </ul>
                    </li>
                </ul>
                <hr class="text-secondary">
                <div class="p-3">
                    <a href="/" class="text-warning text-decoration-none"><i class="bi bi-house me-2"></i>Về trang Shop</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-0 main-content">
                <!-- Header -->
                <header class="bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
                    <h5 class="m-0">Quản trị hệ thống</h5>
                    <div>
                        <span class="me-3">Xin chào, <strong>Admin</strong></span>
                        <a href="#" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
                    </div>
                </header>

                <!-- Container cho nội dung -->
                <div class="container-fluid px-4 pb-5">
                    <!-- Flash Messages -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Nội dung động -->
                    <div th:replace="${content}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
