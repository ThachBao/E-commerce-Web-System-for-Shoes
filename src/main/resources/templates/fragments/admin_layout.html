<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts - Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Premium Styles -->
    <link href="/css/style.css" rel="stylesheet">
    <style>
        /* Sleek Glassmorphic & Modern Alerts */
        .alert-success {
            background-color: #ecfdf5 !important;
            color: #065f46 !important;
            border: 1px solid #a7f3d0 !important;
            border-radius: 16px !important;
            box-shadow: var(--shadow-sm) !important;
            font-weight: 500;
            padding: 1rem 1.25rem;
        }
        .alert-danger {
            background-color: #fff1f2 !important;
            color: #9f1239 !important;
            border: 1px solid #fecdd3 !important;
            border-radius: 16px !important;
            box-shadow: var(--shadow-sm) !important;
            font-weight: 500;
            padding: 1rem 1.25rem;
        }
        .alert .btn-close {
            box-shadow: none !important;
            padding: 1.25rem;
        }
        
        /* Layout modifications */
        .main-content header {
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #f1f5f9 !important;
        }
        
        .sidebar {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%) !important;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-0 sidebar">
                <div class="p-3">
                    <h4><i class="bi bi-box-seam me-2"></i>ShoeStore</h4>
                </div>
                <hr class="mt-0 mb-3 text-secondary">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="/admin/products" class="nav-link"><i class="bi bi-bag me-2"></i>Sản phẩm</a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/categories" class="nav-link"><i class="bi bi-tags me-2"></i>Danh mục</a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/brands" class="nav-link"><i class="bi bi-star me-2"></i>Thương hiệu</a>
                    </li>
                    <li class="nav-item">
                        <a href="/admin/orders" class="nav-link"><i class="bi bi-cart-check me-2"></i>Đơn hàng</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role == 'ROLE_ADMIN'}">
                        <a href="/admin/users" class="nav-link"><i class="bi bi-people me-2"></i>Tài khoản</a>
                    </li>
                    <li class="nav-item">
                        <a href="#attributeSubmenu" data-bs-toggle="collapse" class="nav-link"><i class="bi bi-palette me-2"></i>Thuộc tính <i class="bi bi-caret-down-fill float-end mt-1"></i></a>
                        <ul class="collapse nav flex-column ms-3" id="attributeSubmenu">
                            <li class="nav-item"><a href="/admin/attributes/colors" class="nav-link"><i class="bi bi-circle-fill me-2"></i>Màu sắc</a></li>
                            <li class="nav-item"><a href="/admin/attributes/sizes" class="nav-link"><i class="bi bi-rulers me-2"></i>Kích cỡ</a></li>
                        </ul>
                    </li>
                </ul>
                <hr class="text-secondary">
                <div class="p-3">
                    <a href="/" class="text-warning text-decoration-none"><i class="bi bi-house me-2"></i>Về trang Shop</a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-0 main-content">
                <!-- Header -->
                <header class="bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
                    <h5 class="m-0">Quản trị hệ thống</h5>
                    <div>
                        <span class="me-3">Xin chào, <strong th:text="${currentUser != null ? currentUser.fullName : 'Admin'}">Admin</strong></span>
                        <form action="/admin/logout" method="post" class="d-inline-block m-0 p-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</button>
                        </form>
                    </div>
                </header>

                <!-- Container cho nội dung -->
                <div class="container-fluid px-4 pb-5">
                    <!-- Flash Messages -->
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <!-- Nội dung động -->
                    <div th:replace="${content}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global Confirm Modal -->
    <script>
        function showGlobalConfirm(event, message, actionTarget, confirmText = 'Xác nhận', cancelText = 'Huỷ bỏ') {
            if (event) {
                event.preventDefault();
            }

            const existing = document.getElementById('global-confirm');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.id = 'global-confirm';
            overlay.className = 'position-fixed w-100 h-100 top-0 start-0 d-flex align-items-center justify-content-center';
            overlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
            overlay.style.zIndex = '9999';
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.2s ease';

            const box = document.createElement('div');
            box.className = 'bg-white rounded-4 shadow-lg p-4 text-center mx-3';
            box.style.maxWidth = '380px';
            box.style.transform = 'scale(0.9)';
            box.style.transition = 'transform 0.2s ease';

            const icon = document.createElement('i');
            icon.className = 'bi bi-question-circle text-primary mb-3 d-block';
            icon.style.fontSize = '3.5rem';

            const text = document.createElement('h6');
            text.className = 'mb-4 fw-bold text-dark';
            text.innerText = message;

            const btnRow = document.createElement('div');
            btnRow.className = 'd-flex justify-content-center gap-2';

            const btnCancel = document.createElement('button');
            btnCancel.className = 'btn btn-light fw-medium px-4 rounded-pill';
            btnCancel.innerText = cancelText;
            btnCancel.onclick = () => {
                overlay.style.opacity = '0';
                box.style.transform = 'scale(0.9)';
                setTimeout(() => overlay.remove(), 200);
            };

            const btnOk = document.createElement('button');
            btnOk.className = 'btn btn-primary fw-medium px-4 rounded-pill';
            btnOk.innerText = confirmText;
            btnOk.onclick = () => {
                overlay.style.opacity = '0';
                box.style.transform = 'scale(0.9)';
                setTimeout(() => overlay.remove(), 200);
                
                if (typeof actionTarget === 'string') {
                    const targetEl = document.getElementById(actionTarget);
                    if (targetEl && targetEl instanceof HTMLFormElement) {
                        targetEl.submit();
                    } else {
                        window.location.href = actionTarget;
                    }
                } else if (actionTarget instanceof HTMLFormElement) {
                    actionTarget.submit();
                } else if (typeof actionTarget === 'function') {
                    actionTarget();
                }
            };

            btnRow.appendChild(btnCancel);
            btnRow.appendChild(btnOk);
            box.appendChild(icon);
            box.appendChild(text);
            box.appendChild(btnRow);
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.style.opacity = '1';
                box.style.transform = 'scale(1)';
            }, 10);
            
            return false;
        }

        // Automatic Premium Sidebar Highlighting & Expand
        document.addEventListener('DOMContentLoaded', () => {
            const currentPath = window.location.pathname;
            const sidebarLinks = document.querySelectorAll('.sidebar a');
            sidebarLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '#' && href !== '/' && currentPath.startsWith(href)) {
                    link.classList.add('active');
                    
                    // If it is a submenu item, expand its parent collapse
                    const parentCollapse = link.closest('.collapse');
                    if (parentCollapse) {
                        parentCollapse.classList.add('show');
                        // Find the toggle trigger anchor
                        const trigger = document.querySelector(`[href="#${parentCollapse.id}"]`);
                        if (trigger) trigger.classList.add('active');
                    }
                }
            });
        });
    </script>
    <!-- Custom Premium Interactions -->
    <script src="/js/main.js"></script>
</body>
</html>
