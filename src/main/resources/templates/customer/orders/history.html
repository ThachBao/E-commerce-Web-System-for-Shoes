<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shop_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đơn hàng của tôi | ShoeStore</title>
</head>
<body>
<section class="py-5 bg-light">
    <div class="container py-4">
        <div class="row mb-4">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb bg-transparent p-0">
                        <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-dark">Trang chủ</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Đơn hàng của tôi</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row">
            <!-- Sidebar -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-warning text-dark d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <h5 class="fw-bold mb-1" th:text="${currentUser.fullName}">Tên người dùng</h5>
                        <p class="text-muted small mb-3" th:text="${currentUser.email}">email@example.com</p>
                        
                        <hr class="my-4">
                        
                        <div class="d-flex flex-column gap-2 text-start">
                            <a href="/profile" class="btn btn-outline-secondary border-0 w-100 text-start py-2 px-3 fw-medium text-dark">
                                <i class="bi bi-person me-2"></i> Thông tin cá nhân
                            </a>
                            <a href="/orders" class="btn btn-dark w-100 text-start py-2 px-3 fw-medium">
                                <i class="bi bi-bag-check me-2"></i> Lịch sử đơn hàng
                            </a>
                            <form action="/logout" method="post" class="mt-2">
                                <button type="submit" class="btn btn-outline-danger border-0 w-100 text-start py-2 px-3 fw-medium">
                                    <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Orders Content -->
            <div class="col-lg-9 col-md-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="fw-bold mb-4 border-bottom pb-3">Lịch sử đơn hàng</h3>
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle border-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="border-0 rounded-start">Mã Đơn</th>
                                        <th class="border-0">Ngày Đặt</th>
                                        <th class="border-0 text-center">Trạng Thái</th>
                                        <th class="border-0 text-end">Tổng Tiền</th>
                                        <th class="border-0 rounded-end text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td class="fw-bold" th:text="${order.orderCode}"></td>
                                        <td th:text="${order.placedAt != null ? #temporals.format(order.placedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                                        <td class="text-center">
                                            <span th:switch="${order.orderStatus}">
                                                <span th:case="'PENDING'" class="badge bg-warning text-dark py-2 px-3 rounded-pill"><i class="bi bi-hourglass-split me-1"></i> Chờ duyệt</span>
                                                <span th:case="'CONFIRMED'" class="badge bg-primary py-2 px-3 rounded-pill"><i class="bi bi-check-circle me-1"></i> Đã xác nhận</span>
                                                <span th:case="'PROCESSING'" class="badge bg-info text-dark py-2 px-3 rounded-pill"><i class="bi bi-box-seam me-1"></i> Đang chuẩn bị</span>
                                                <span th:case="'SHIPPING'" class="badge bg-secondary py-2 px-3 rounded-pill"><i class="bi bi-truck me-1"></i> Đang giao</span>
                                                <span th:case="'COMPLETED'" class="badge bg-success py-2 px-3 rounded-pill"><i class="bi bi-bag-check me-1"></i> Hoàn thành</span>
                                                <span th:case="'CANCELLED'" class="badge bg-danger py-2 px-3 rounded-pill"><i class="bi bi-x-circle me-1"></i> Đã hủy</span>
                                                <span th:case="*" class="badge bg-dark py-2 px-3 rounded-pill" th:text="${order.orderStatus}"></span>
                                            </span>
                                        </td>
                                        <td class="text-end fw-bold text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                        <td class="text-center">
                                            <a class="btn btn-sm btn-outline-dark rounded-pill px-3" th:href="@{/orders/{id}(id=${order.id})}">
                                                Xem <i class="bi bi-arrow-right ms-1"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(orders)}">
                                        <td colspan="5" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            Bạn chưa có đơn hàng nào. <a href="/products" class="text-primary text-decoration-none">Mua sắm ngay!</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
