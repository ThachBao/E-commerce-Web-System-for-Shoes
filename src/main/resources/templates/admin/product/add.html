<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Thêm Sản phẩm</title>
</head>
<body>
    <section>
        <div class="mb-4">
            <a href="/admin/products" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
            <h2 class="h4 mt-2">Thêm Sản phẩm mới</h2>
        </div>

        <form th:action="@{/admin/products/add}" th:object="${productRequest}" method="post" enctype="multipart/form-data">
            <div class="row">
                <!-- Cột thông tin chính -->
                <div class="col-lg-8 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-bold">Thông tin cơ bản</div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Mã Sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{code}" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" placeholder="VD: SP01">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Tên Sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Mô tả chi tiết</label>
                                <textarea class="form-control" th:field="*{description}" rows="5" placeholder="Nhập mô tả sản phẩm..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột thông tin phụ -->
                <div class="col-lg-4 mb-4">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold">Phân loại</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{categoryId}" required>
                                    <option value="">- Chọn Danh mục -</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Thương hiệu</label>
                                <select class="form-select" th:field="*{brandId}">
                                    <option value="">- Không chọn -</option>
                                    <option th:each="br : ${brands}" th:value="${br.id}" th:text="${br.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Giới tính</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="UNISEX">Unisex</option>
                                    <option value="MEN">Nam</option>
                                    <option value="WOMEN">Nữ</option>
                                    <option value="KIDS">Trẻ em</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold">Hình ảnh & Tùy chọn</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ảnh đại diện (Thumbnail) <span class="text-danger">*</span></label>
                                <input type="file" class="form-control form-control-sm" name="thumbnailFile" accept="image/*" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Ảnh bổ sung (Nhiều ảnh)</label>
                                <input type="file" class="form-control form-control-sm" name="imageFiles" accept="image/*" multiple>
                            </div>
                            <hr>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isFeatured}" id="featuredSwitch">
                                <label class="form-check-label" for="featuredSwitch">Sản phẩm nổi bật (Hiển thị trang chủ)</label>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="activeSwitch" checked>
                                <label class="form-check-label" for="activeSwitch">Hoạt động (Hiển thị ra ngoài)</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-save me-1"></i> Tạo Sản Phẩm</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </section>
</body>
</html>
