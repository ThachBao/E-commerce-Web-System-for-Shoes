<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Manage Orders</title>
</head>
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Manage Orders</h2>
            <p class="text-muted mb-0">Admin order management page</p>
        </div>

    </div>

    <!-- LUỒNG 2: Admin lọc đơn hàng theo trạng thái -->
    <div class="card mb-4">
        <div class="card-header fw-bold">
            Filter Orders
        </div>

        <div class="card-body">
            <form method="get" th:action="@{/admin/orders}" class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="form-label">Order Status</label>
                    <select name="status" class="form-select">
                        <option value="">All statuses</option>
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">PENDING</option>
                        <option value="CONFIRMED" th:selected="${selectedStatus == 'CONFIRMED'}">CONFIRMED</option>
                        <option value="PROCESSING" th:selected="${selectedStatus == 'PROCESSING'}">PROCESSING</option>
                        <option value="SHIPPING" th:selected="${selectedStatus == 'SHIPPING'}">SHIPPING</option>
                        <option value="COMPLETED" th:selected="${selectedStatus == 'COMPLETED'}">COMPLETED</option>
                        <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">CANCELLED</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Filter
                    </button>
                </div>

                <div class="col-md-2">
                    <a th:href="@{/admin/orders}" class="btn btn-secondary w-100">
                        Reset
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- LUỒNG 1: Admin xem danh sách đơn hàng -->
    <div class="card">
        <div class="card-header fw-bold">
            Order List
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Order Code</th>
                    <th>Customer</th>
                    <th>Order Status</th>
                    <th>Payment</th>
                    <th>Total Amount</th>
                    <th>Placed At</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}"></td>

                    <td class="fw-semibold" th:text="${order.orderCode}"></td>

                    <td th:text="${order.user != null ? order.user.fullName : 'N/A'}"></td>

                    <td>
                        <span th:switch="${order.orderStatus}">
                            <span th:case="'PENDING'" class="badge bg-warning text-dark">PENDING</span>
                            <span th:case="'CONFIRMED'" class="badge bg-primary">CONFIRMED</span>
                            <span th:case="'PROCESSING'" class="badge bg-info text-dark">PROCESSING</span>
                            <span th:case="'SHIPPING'" class="badge bg-secondary">SHIPPING</span>
                            <span th:case="'COMPLETED'" class="badge bg-success">COMPLETED</span>
                            <span th:case="'CANCELLED'" class="badge bg-danger">CANCELLED</span>
                            <span th:case="*" class="badge bg-dark" th:text="${order.orderStatus}"></span>
                        </span>
                    </td>

                    <td>
                        <div>
                            <span class="fw-semibold" th:text="${order.paymentMethod}"></span>
                        </div>

                        <div>
                            <span th:switch="${order.paymentStatus}">
                                <span th:case="'PAID'" class="badge bg-success">PAID</span>
                                <span th:case="'PENDING'" class="badge bg-warning text-dark">PENDING</span>
                                <span th:case="'UNPAID'" class="badge bg-danger">UNPAID</span>
                                <span th:case="*" class="badge bg-secondary" th:text="${order.paymentStatus}"></span>
                            </span>
                        </div>
                    </td>

                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>

                    <td th:text="${order.placedAt != null ? #temporals.format(order.placedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>

                    <td>
                        <div class="d-flex gap-1 justify-content-center">
                            <!-- COD ORDER FLOW -->
                            <th:block th:if="${order.paymentMethod == 'COD'}">
                                <!-- Nút Chi tiết -->
                                <a class="btn btn-sm btn-info"
                                   th:href="@{/admin/orders/{id}(id=${order.id})}" title="Chi tiết">
                                    Detail
                                </a>

                                <!-- PENDING status for COD -->
                                <th:block th:if="${order.orderStatus == 'PENDING'}">
                                    <!-- Xác nhận -->
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                                        <input type="hidden" name="newStatus" value="CONFIRMED" />
                                        <button type="submit" class="btn btn-sm btn-primary" title="Xác nhận đơn"
                                                onclick="return showGlobalConfirm(event, 'Xác nhận đơn hàng này?', this.closest('form'));">
                                            <i class="bi bi-check2"></i> Xác nhận
                                        </button>
                                    </form>
                                    <!-- Reject (Từ chối) -->
                                    <form th:action="@{/admin/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-danger" title="Từ chối đơn"
                                                onclick="return confirmReject(event, this.closest('form'));">
                                            <i class="bi bi-x-circle"></i> Reject
                                        </button>
                                    </form>
                                </th:block>

                                <!-- CONFIRMED status for COD -->
                                <th:block th:if="${order.orderStatus == 'CONFIRMED'}">
                                    <!-- Xử lý (Giao) -->
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                                        <input type="hidden" name="newStatus" value="SHIPPING" />
                                        <button type="submit" class="btn btn-sm btn-warning" title="Chuyển sang Giao hàng (Xử lý)"
                                                onclick="return showGlobalConfirm(event, 'Chuyển đơn hàng sang trạng thái Giao hàng (Xử lý)?', this.closest('form'));">
                                            <i class="bi bi-gear"></i> Xử lý
                                        </button>
                                    </form>
                                </th:block>

                                <!-- SHIPPING status for COD -->
                                <th:block th:if="${order.orderStatus == 'SHIPPING'}">
                                    <!-- Unpaid COD -->
                                    <th:block th:if="${order.paymentStatus != 'PAID'}">
                                        <!-- Nhận tiền -->
                                        <form th:action="@{/admin/orders/{id}/mark-paid(id=${order.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-success" title="Xác nhận đã nhận tiền"
                                                    onclick="return showGlobalConfirm(event, 'Xác nhận đã nhận tiền cho đơn hàng này?', this.closest('form'));">
                                                <i class="bi bi-cash-coin"></i> Nhận tiền
                                            </button>
                                        </form>
                                        <!-- Hoàn trả hàng -->
                                        <form th:action="@{/admin/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-dark" title="Hoàn trả hàng và hủy đơn"
                                                    onclick="return confirmReturn(event, this.closest('form'));">
                                                <i class="bi bi-arrow-counterclockwise"></i> Hoàn trả hàng
                                            </button>
                                        </form>
                                    </th:block>

                                    <!-- Paid COD -->
                                    <th:block th:if="${order.paymentStatus == 'PAID'}">
                                        <!-- Hoàn thành đơn -->
                                        <form th:action="@{/admin/orders/{id}/complete(id=${order.id})}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-success" title="Hoàn thành đơn"
                                                    onclick="return showGlobalConfirm(event, 'Xác nhận hoàn thành đơn hàng?', this.closest('form'));">
                                                <i class="bi bi-check-circle-fill"></i> Hoàn thành đơn
                                            </button>
                                        </form>
                                    </th:block>
                                </th:block>
                            </th:block>

                            <!-- NON-COD ORDER FLOW -->
                            <th:block th:if="${order.paymentMethod != 'COD'}">
                                <!-- Nút Chi tiết -->
                                <a class="btn btn-sm btn-info"
                                   th:href="@{/admin/orders/{id}(id=${order.id})}" title="Chi tiết">
                                    Detail
                                </a>

                                <!-- PENDING status for BANK (Unpaid) -->
                                <th:block th:if="${order.orderStatus == 'PENDING'}">
                                    <!-- Nhận tiền -->
                                    <form th:action="@{/admin/orders/{id}/mark-paid(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-success" title="Xác nhận đã nhận tiền"
                                                onclick="return showGlobalConfirm(event, 'Xác nhận đã nhận tiền thanh toán (BANK) cho đơn hàng này?', this.closest('form'));">
                                            <i class="bi bi-cash-coin"></i> Nhận tiền
                                        </button>
                                    </form>
                                    <!-- Reject (Từ chối) -->
                                    <form th:action="@{/admin/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-danger" title="Từ chối đơn"
                                                onclick="return confirmReject(event, this.closest('form'));">
                                            <i class="bi bi-x-circle"></i> Reject
                                        </button>
                                    </form>
                                </th:block>

                                <!-- CONFIRMED status for BANK (Paid) -->
                                <th:block th:if="${order.orderStatus == 'CONFIRMED'}">
                                    <!-- Xử lý (Giao) -->
                                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                                        <input type="hidden" name="newStatus" value="SHIPPING" />
                                        <button type="submit" class="btn btn-sm btn-warning" title="Chuyển sang Giao hàng (Xử lý)"
                                                onclick="return showGlobalConfirm(event, 'Chuyển đơn hàng sang trạng thái Giao hàng (Xử lý)?', this.closest('form'));">
                                            <i class="bi bi-gear"></i> Xử lý
                                        </button>
                                    </form>
                                </th:block>

                                <!-- SHIPPING status for BANK -->
                                <th:block th:if="${order.orderStatus == 'SHIPPING'}">
                                    <!-- Hoàn thành đơn -->
                                    <form th:action="@{/admin/orders/{id}/complete(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-success" title="Hoàn thành đơn"
                                                onclick="return showGlobalConfirm(event, 'Xác nhận hoàn thành đơn hàng?', this.closest('form'));">
                                            <i class="bi bi-check-circle-fill"></i> Hoàn thành
                                        </button>
                                    </form>
                                    <!-- Hoàn trả hàng -->
                                    <form th:action="@{/admin/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-dark" title="Hoàn trả hàng và hủy đơn"
                                                onclick="return confirmReturn(event, this.closest('form'));">
                                            <i class="bi bi-arrow-counterclockwise"></i> Hoàn trả hàng
                                        </button>
                                    </form>
                                </th:block>
                            </th:block>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="8" class="text-muted py-4">
                        No orders found
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-4" th:if="${orderPage != null and orderPage.totalPages > 1}">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${orderPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/orders(page=${orderPage.number - 1}, status=${selectedStatus})}">
                    Previous
                </a>
            </li>

            <li class="page-item disabled">
                <span class="page-link">
                    Page
                    <span th:text="${orderPage.number + 1}"></span>
                    /
                    <span th:text="${orderPage.totalPages}"></span>
                </span>
            </li>

            <li class="page-item" th:classappend="${orderPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/orders(page=${orderPage.number + 1}, status=${selectedStatus})}">
                    Next
                </a>
            </li>

        </ul>
    </nav>

    <!-- Real-time Order Updates -->
    <script th:inline="javascript">
        let currentOrderCount = -1;

        async function fetchInitialCount() {
            try {
                const res = await fetch('/admin/orders/latest-count');
                if (res.ok) {
                    currentOrderCount = parseInt(await res.text());
                }
            } catch (e) {
                console.error("Error fetching order count", e);
            }
        }

        async function checkForNewOrders() {
            if (currentOrderCount === -1) return;

            try {
                const res = await fetch('/admin/orders/latest-count');
                if (res.ok) {
                    const newCount = parseInt(await res.text());
                    if (newCount > currentOrderCount) {
                        currentOrderCount = newCount;
                        showAdminToast('🔔 Có đơn hàng mới! Đang tự động cập nhật...', 'success');
                        updateOrderTable();
                    }
                }
            } catch (e) {
                console.error("Error checking new orders", e);
            }
        }

        function showAdminToast(message, type = 'success') {
            let container = document.getElementById('admin-toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'admin-toast-container';
                container.className = 'position-fixed bottom-0 end-0 p-3';
                container.style.zIndex = '1055';
                document.body.appendChild(container);
            }

            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'success' ? 'bg-success' : 'bg-primary';
            const html = `
                <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0 show" role="alert" aria-live="assertive" aria-atomic="true" style="transition: opacity 0.3s; opacity: 0;">
                    <div class="d-flex">
                        <div class="toast-body fw-medium fs-6">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" onclick="document.getElementById('${toastId}').remove()"></button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            const toastEl = document.getElementById(toastId);
            setTimeout(() => { toastEl.style.opacity = '1'; }, 10);
            setTimeout(() => {
                toastEl.style.opacity = '0';
                setTimeout(() => toastEl.remove(), 300);
            }, 4000);
        }

        async function updateOrderTable() {
            try {
                // Fetch the current URL which has all filter parameters
                const res = await fetch(window.location.href);
                const html = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Replace the tbody
                const newTbody = doc.querySelector('table tbody');
                const oldTbody = document.querySelector('table tbody');
                if (newTbody && oldTbody) {
                    oldTbody.innerHTML = newTbody.innerHTML;
                    // Visual feedback
                    oldTbody.style.opacity = '0.5';
                    setTimeout(() => {
                        oldTbody.style.transition = 'opacity 0.5s ease-in';
                        oldTbody.style.opacity = '1';
                    }, 50);
                }
                
                // Replace pagination if it exists
                const newPagination = doc.querySelector('nav.mt-4');
                const oldPagination = document.querySelector('nav.mt-4');
                if (newPagination && oldPagination) {
                    oldPagination.innerHTML = newPagination.innerHTML;
                } else if (newPagination && !oldPagination) {
                    document.querySelector('section').appendChild(newPagination);
                }
            } catch (e) {
                console.error("Error updating table", e);
            }
        }

        function showReasonModal(title, placeholder, onConfirm) {
            const existing = document.getElementById('global-reason-modal');
            if (existing) existing.remove();

            const modalHtml = `
                <div class="modal fade" id="global-reason-modal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content border-0 shadow-lg rounded-4">
                            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                                <h5 class="modal-title fw-bold text-dark d-flex align-items-center">
                                    <i class="bi bi-chat-left-text text-warning me-2 fs-4"></i>
                                    <span>${title}</span>
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body px-4 py-3">
                                <div class="form-group mb-0">
                                    <label class="form-label text-muted fw-bold small text-uppercase mb-2">Lý do thực hiện</label>
                                    <textarea id="global-reason-textarea" class="form-control bg-light border-0 rounded-3 p-3 text-dark" rows="3" placeholder="${placeholder}" style="resize: none; font-size: 0.95rem;"></textarea>
                                </div>
                            </div>
                            <div class="modal-footer border-top-0 pb-4 pt-2 px-4 gap-2">
                                <button type="button" class="btn btn-light rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Hủy bỏ</button>
                                <button type="button" id="global-reason-confirm-btn" class="btn btn-primary rounded-pill px-4 fw-semibold">Xác nhận</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);

            const modalElement = document.getElementById('global-reason-modal');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();

            const confirmBtn = document.getElementById('global-reason-confirm-btn');
            const textarea = document.getElementById('global-reason-textarea');

            modalElement.addEventListener('shown.bs.modal', () => {
                textarea.focus();
            });

            confirmBtn.onclick = () => {
                const value = textarea.value.trim();
                modal.hide();
                modalElement.addEventListener('hidden.bs.modal', () => {
                    modalElement.remove();
                });
                onConfirm(value);
            };
        }

        function confirmReject(event, form) {
            if (event) event.preventDefault();
            showReasonModal(
                "Từ chối giao hàng",
                "Nhập lý do từ chối giao hàng (ví dụ: Khách yêu cầu hủy, không liên lạc được...)",
                function(reason) {
                    const noteVal = "Từ chối giao hàng: " + (reason || "Không có lý do cụ thể");
                    let noteInput = form.querySelector('input[name="note"]');
                    if (!noteInput) {
                        noteInput = document.createElement('input');
                        noteInput.type = 'hidden';
                        noteInput.name = 'note';
                        form.appendChild(noteInput);
                    }
                    noteInput.value = noteVal;
                    form.submit();
                }
            );
            return false;
        }

        function confirmReturn(event, form) {
            if (event) event.preventDefault();
            showReasonModal(
                "Hoàn trả hàng & Hủy đơn",
                "Nhập lý do hoàn trả hàng (ví dụ: Khách không nhận hàng, hàng bị lỗi...)",
                function(reason) {
                    const noteVal = "Hoàn trả hàng: " + (reason || "Không có lý do cụ thể");
                    let noteInput = form.querySelector('input[name="note"]');
                    if (!noteInput) {
                        noteInput = document.createElement('input');
                        noteInput.type = 'hidden';
                        noteInput.name = 'note';
                        form.appendChild(noteInput);
                    }
                    noteInput.value = noteVal;
                    form.submit();
                }
            );
            return false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchInitialCount().then(() => {
                setInterval(checkForNewOrders, 5000);
            });
        });
    </script>
</section>
</body>
</html>
