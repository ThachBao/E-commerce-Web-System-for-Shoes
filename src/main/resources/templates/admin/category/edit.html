<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Cập nhật Danh mục</title>
</head>
<body>
    <section>
        <div class="mb-4">
            <a href="/admin/categories" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
            <h2 class="h4 mt-2">Cập nhật Danh mục</h2>
        </div>

        <div class="card border-0 shadow-sm" style="max-width: 800px;">
            <div class="card-body p-4">
                <form th:action="@{/admin/categories/edit/{id}(id=${categoryId})}" th:object="${categoryRequest}" method="post">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Mã Danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{code}" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tên Danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Danh mục cha</label>
                            <select class="form-select" th:field="*{parentId}">
                                <option value="">-- Không có (Danh mục gốc) --</option>
                                <th:block th:each="parent : ${parentCategories}">
                                    <!-- Không hiển thị chính nó trong danh sách cha -->
                                    <option th:if="${parent.id != categoryId}" th:value="${parent.id}" th:text="${parent.name}"></option>
                                </th:block>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Trạng thái</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" role="switch" th:field="*{isActive}" id="activeSwitch">
                                <label class="form-check-label" for="activeSwitch">Hoạt động</label>
                            </div>
                        </div>
                    </div>

                    <hr class="text-secondary mb-4">
                    <div class="text-end">
                        <a href="/admin/categories" class="btn btn-light me-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
