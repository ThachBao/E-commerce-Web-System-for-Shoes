<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">My Orders</h2>
            <p class="text-muted mb-0">Customer order history page</p>
        </div>

        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary">
            Admin View
        </a>
    </div>

    <!-- LUỒNG 8: Customer xem lịch sử đơn hàng -->
    <div class="card">
        <div class="card-header fw-bold">
            Order History
        </div>

        <div class="card-body p-0">
            <table class="table table-bordered table-hover text-center align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Order Code</th>
                    <th>Order Status</th>
                    <th>Payment</th>
                    <th>Total Amount</th>
                    <th>Placed At</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="order : ${orders}">
                    <td class="fw-semibold" th:text="${order.orderCode}"></td>

                    <td>
                        <span th:switch="${order.orderStatus}">
                            <span th:case="'PENDING'" class="badge bg-warning text-dark">PENDING</span>
                            <span th:case="'CONFIRMED'" class="badge bg-primary">CONFIRMED</span>
                            <span th:case="'PROCESSING'" class="badge bg-info text-dark">PROCESSING</span>
                            <span th:case="'SHIPPING'" class="badge bg-secondary">SHIPPING</span>
                            <span th:case="'COMPLETED'" class="badge bg-success">COMPLETED</span>
                            <span th:case="'CANCELLED'" class="badge bg-danger">CANCELLED</span>
                            <span th:case="*" class="badge bg-dark" th:text="${order.orderStatus}"></span>
                        </span>
                    </td>

                    <td>
                        <div th:text="${order.paymentMethod}"></div>
                        <div>
                            <span th:switch="${order.paymentStatus}">
                                <span th:case="'PAID'" class="badge bg-success">PAID</span>
                                <span th:case="'PENDING'" class="badge bg-warning text-dark">PENDING</span>
                                <span th:case="'UNPAID'" class="badge bg-danger">UNPAID</span>
                                <span th:case="*" class="badge bg-secondary" th:text="${order.paymentStatus}"></span>
                            </span>
                        </div>
                    </td>

                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>

                    <td th:text="${order.placedAt != null ? #temporals.format(order.placedAt, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>

                    <td>
                        <!-- LUỒNG 9: Customer đi đến trang chi tiết đơn hàng của mình -->
                        <a class="btn btn-sm btn-info"
                           th:href="@{/orders/{id}(id=${order.id})}">
                            Detail
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6" class="text-muted py-4">
                        No orders found
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
